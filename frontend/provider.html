<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anbieter-Profil — Startup Radar</title>
  <meta name="description" content="Provider-Profil auf Startup Radar.">
  <meta property="og:site_name" content="Startup Radar by JackNemo">
  <meta property="og:type" content="profile">
  <meta property="og:title" id="og-title" content="">
  <meta property="og:description" id="og-desc" content="">
  <meta property="og:url" id="og-url" content="">
  <!-- K-179: Dynamic SEO meta populated by JS -->
  <script>
    (function() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) return;
      fetch('/api/seo/provider/' + id)
        .then(r => r.ok ? r.json() : null)
        .then(d => {
          if (!d) return;
          document.title = d.title;
          const setMeta = (id, val) => { const el = document.getElementById(id); if (el && val) el.setAttribute('content', val); };
          const desc = document.querySelector('meta[name="description"]');
          if (desc && d.description) desc.setAttribute('content', d.description);
          setMeta('og-title', d.og && d.og.title);
          setMeta('og-desc', d.og && d.og.description);
          setMeta('og-url', d.og && d.og.url);
        }).catch(() => {});
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; margin: 0; min-height: 100vh; }
    nav { background: #1e293b; padding: 0 20px; height: 52px; display: flex; align-items: center; gap: 16px; }
    nav a { color: #cbd5e1; text-decoration: none; font-size: 14px; }
    nav a:hover { color: #fff; }
    nav .logo { color: #fff; font-weight: 700; font-size: 16px; margin-right: auto; }

    .container { max-width: 820px; margin: 28px auto; padding: 0 16px; }

    /* Hero card */
    .hero { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 10px rgba(0,0,0,.07); display: flex; gap: 20px; align-items: flex-start; }
    .hero-logo { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #e0e7ff; display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; }
    .hero-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
    .hero-info { flex: 1; min-width: 0; }
    .hero-info h1 { margin: 0 0 6px; font-size: 22px; color: #1e293b; }
    .hero-desc { color: #475569; font-size: 14px; margin: 0 0 10px; line-height: 1.5; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .badge { font-size: 12px; padding: 3px 10px; border-radius: 99px; font-weight: 600; }
    .badge-verified { background: #d1fae5; color: #065f46; }
    .badge-rating { background: #fef3c7; color: #92400e; }
    .badge-listings { background: #e0e7ff; color: #3730a3; }
    .hero-meta { font-size: 13px; color: #6b7280; display: flex; flex-wrap: wrap; gap: 12px; }
    .hero-meta a { color: #4f46e5; text-decoration: none; }
    .hero-meta a:hover { text-decoration: underline; }

    /* Ratings */
    .section { margin-top: 20px; }
    .section-title { font-size: 16px; font-weight: 700; color: #1e293b; margin: 0 0 12px; }
    .rating-summary { background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 1px 6px rgba(0,0,0,.06); display: flex; align-items: center; gap: 20px; margin-bottom: 12px; }
    .rating-big { font-size: 36px; font-weight: 800; color: #1e293b; line-height: 1; }
    .stars { color: #f59e0b; font-size: 18px; letter-spacing: 2px; }
    .rating-count { font-size: 13px; color: #6b7280; margin-top: 2px; }
    .review-card { background: #fff; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    .review-stars { color: #f59e0b; font-size: 14px; }
    .review-text { font-size: 13px; color: #374151; margin: 4px 0 0; line-height: 1.5; }
    .review-meta { font-size: 11px; color: #9ca3af; margin-top: 4px; }

    /* Listings */
    .listing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .listing-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.06); text-decoration: none; color: inherit; display: block; transition: box-shadow .15s; }
    .listing-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    .listing-card h3 { margin: 0 0 4px; font-size: 15px; color: #1e293b; }
    .listing-card .meta { font-size: 12px; color: #6b7280; margin: 4px 0; }
    .listing-card .price { font-size: 13px; color: #4f46e5; font-weight: 600; margin-top: 6px; }
    .type-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #f3f4f6; color: #374151; display: inline-block; margin-bottom: 6px; }
    .listing-thumb { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; display: block; }
    .premium-chip { font-size: 11px; background: #fef3c7; color: #92400e; padding: 2px 7px; border-radius: 99px; font-weight: 600; margin-left: 6px; }

    /* Empty / skeleton */
    .empty { color: #9ca3af; font-size: 14px; padding: 20px 0; text-align: center; }
    .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-hero { height: 120px; border-radius: 12px; margin-bottom: 20px; }
    .skel-row { height: 18px; margin-bottom: 10px; }

    .error-state { text-align: center; padding: 48px 20px; }
    .error-state h2 { color: #1e293b; margin: 0 0 8px; }
    .error-state p { color: #64748b; }

    @media (max-width: 540px) {
      .hero { flex-direction: column; }
      .hero-logo { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>
  <nav>
    <span class="logo">&#x1F680; Startup Radar</span>
    <a href="founder-dashboard.html">Radar</a>
    <a href="auth.html" id="nav-login" style="display:none">Login</a>
    <a href="founder-dashboard.html" id="nav-dash" style="display:none">Dashboard</a>
  </nav>

  <div class="container">
    <!-- Skeleton -->
    <div id="skeleton">
      <div class="skeleton skel-hero"></div>
      <div class="skeleton skel-row" style="width:60%"></div>
      <div class="skeleton skel-row" style="width:80%"></div>
      <div class="skeleton skel-row" style="width:40%"></div>
    </div>

    <!-- Error -->
    <div id="error-state" class="error-state" style="display:none">
      <h2>Anbieter nicht gefunden</h2>
      <p>Dieser Anbieter existiert nicht oder hat kein öffentliches Profil.</p>
      <a href="founder-dashboard.html" style="color:#4f46e5;font-size:14px">← Zurück zum Radar</a>
    </div>

    <!-- Profile -->
    <div id="profile-content" style="display:none">
      <div class="hero">
        <div class="hero-logo" id="logo-wrap">&#x1F3E2;</div>
        <div class="hero-info">
          <h1 id="prov-name">—</h1>
          <p class="hero-desc" id="prov-desc"></p>
          <div class="badges" id="prov-badges"></div>
          <div class="hero-meta" id="prov-meta"></div>
        </div>
      </div>

      <!-- Listings -->
      <div class="section" id="listings-section">
        <div class="section-title">Aktive Inserate</div>
        <div class="listing-grid" id="listing-grid">
          <p class="empty">Keine aktiven Inserate.</p>
        </div>
      </div>

      <!-- K-184: Portfolio / Case Studies -->
      <div class="section" id="portfolio-section" style="display:none">
        <div class="section-title">Portfolio &amp; Case Studies</div>
        <div id="portfolio-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:12px"></div>
      </div>

      <!-- Ratings -->
      <div class="section" id="ratings-section">
        <div class="section-title">Bewertungen</div>
        <div class="rating-summary" id="rating-summary" style="display:none"></div>
        <div id="reviews-list"></div>
        <!-- K-166: Submit rating (founders only) -->
        <div id="rate-form" style="display:none;margin-top:16px;padding:14px 16px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px">
          <div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:8px">Eigene Bewertung abgeben</div>
          <div id="star-picker" style="font-size:28px;cursor:pointer;letter-spacing:4px;color:#d1d5db;margin-bottom:8px">&#9733;&#9733;&#9733;&#9733;&#9733;</div>
          <textarea id="rate-comment" rows="2" placeholder="Optionaler Kommentar…" maxlength="500" style="width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;resize:vertical;box-sizing:border-box;margin-bottom:8px"></textarea>
          <div style="display:flex;align-items:center;gap:8px">
            <button id="rate-submit-btn" onclick="doSubmitRating()" style="padding:7px 16px;background:#4f46e5;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px">Bewertung senden</button>
            <span id="rate-msg" style="font-size:13px;display:none"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script>
    // Nav state
    if (auth.getToken()) {
      document.getElementById('nav-dash').style.display = 'inline';
    } else {
      document.getElementById('nav-login').style.display = 'inline';
    }

    const params = new URLSearchParams(location.search);
    const providerId = params.get('id');

    function stars(n) {
      const full = Math.round(n);
      return '★'.repeat(full) + '☆'.repeat(5 - full);
    }

    function formatPrice(l) {
      const parts = [];
      if (l.hourly_rate) parts.push('€' + parseFloat(l.hourly_rate).toFixed(0) + '/Std');
      if (l.daily_rate) parts.push('€' + parseFloat(l.daily_rate).toFixed(0) + '/Tag');
      if (l.from_price && !parts.length) parts.push('ab €' + parseFloat(l.from_price).toFixed(0));
      return parts.join(' · ');
    }

    async function load() {
      if (!providerId) {
        show('error');
        return;
      }

      try {
        const [profRes, listRes, rateRes, responseRes] = await Promise.allSettled([
          ProvidersAPI.getProfile(providerId),
          ProvidersAPI.getListings(providerId),
          ProvidersAPI.getRatings(providerId),
          // K-71: response rate
          api('GET', '/providers/' + providerId + '/response-rate'),
        ]);

        const profile = profRes.status === 'fulfilled' ? profRes.value.profile : null;

        if (!profile) {
          show('error');
          return;
        }

        // Hero
        document.getElementById('prov-name').textContent = profile.company_name || 'Anbieter';
        if (profile.description) {
          document.getElementById('prov-desc').textContent = profile.description;
        }

        // Logo
        if (profile.logo_url) {
          document.getElementById('logo-wrap').innerHTML = '<img src="' + profile.logo_url + '" alt="" onerror="this.parentElement.textContent=\'🏢\'">';
        }

        // Badges
        const badges = [];
        if (profile.is_verified) badges.push('<span class="badge badge-verified">✓ Verifiziert</span>');
        // K-89: prefer rating from dedicated ratings endpoint (more up-to-date than profile.avg_rating)
        const ratingsForBadge = rateRes.status === 'fulfilled' ? rateRes.value : null;
        const avgForBadge = ratingsForBadge?.average || profile.avg_rating;
        if (avgForBadge && parseFloat(avgForBadge) > 0) {
          badges.push('<span class="badge badge-rating">' + stars(avgForBadge) + ' ' + parseFloat(avgForBadge).toFixed(1) + '</span>');
        }
        // K-71: Response rate badge
        const rrData = responseRes.status === 'fulfilled' ? responseRes.value : null;
        if (rrData && rrData.rate !== null && rrData.total > 0) {
          const rr = rrData.rate;
          const rrColor = rr >= 80 ? '#d1fae5' : rr >= 50 ? '#fef3c7' : '#fee2e2';
          const rrText = rr >= 80 ? '#065f46' : rr >= 50 ? '#92400e' : '#991b1b';
          badges.push('<span class="badge" style="background:' + rrColor + ';color:' + rrText + '" title="Antwortet auf ' + rrData.replied + ' von ' + rrData.total + ' Nachrichten">&#x1F4E9; ' + rr + '% Antwortrate</span>');
        }
        // K-121: Active listing count badge — computed before render since listings are already fetched
        const listings = listRes.status === 'fulfilled' ? (listRes.value.listings || []) : [];
        if (listings.length) {
          badges.push('<span class="badge badge-listings">&#x1F4CB; ' + listings.length + ' aktive' + (listings.length !== 1 ? ' Inserate' : 's Inserat') + '</span>');
        }
        document.getElementById('prov-badges').innerHTML = badges.join('');

        // Meta
        const meta = [];
        if (profile.website) meta.push('<a href="' + profile.website + '" target="_blank" rel="noopener">&#x1F517; ' + profile.website.replace(/^https?:\/\//, '') + '</a>');
        if (profile.contact_email) meta.push('<span>&#x2709;&#xFE0F; <a href="mailto:' + profile.contact_email + '">' + profile.contact_email + '</a></span>');
        // K-97: Social links
        const sl = profile.social_links || (typeof profile.social_links === 'string' ? JSON.parse(profile.social_links) : null) || {};
        if (sl.linkedin) meta.push('<a href="' + sl.linkedin + '" target="_blank" rel="noopener" style="font-weight:600">in LinkedIn</a>');
        if (sl.twitter) meta.push('<a href="' + sl.twitter + '" target="_blank" rel="noopener" style="font-weight:600">𝕏 Twitter</a>');
        document.getElementById('prov-meta').innerHTML = meta.join('');
        const grid = document.getElementById('listing-grid');
        const PREVIEW = 4;
        function renderListings(all) {
          grid.innerHTML = all.map(l => `
            <a class="listing-card" href="listing.html?id=${l.id}">
              ${l.image_url ? '<img class="listing-thumb" src="' + l.image_url + '" alt="" onerror="this.remove()">' : ''}
              <span class="type-badge">${l.type || '—'}</span>${l.is_premium ? '<span class="premium-chip">⭐ Premium</span>' : ''}
              <h3>${l.title}</h3>
              <div class="meta">${l.geo || ''}${l.city ? ' · ' + l.city : ''}</div>
              ${formatPrice(l) ? '<div class="price">' + formatPrice(l) + '</div>' : ''}
            </a>
          `).join('');
        }
        if (listings.length) {
          document.getElementById('listings-section').querySelector('.section-title').textContent =
            'Aktive Inserate (' + listings.length + ')';
          renderListings(listings.slice(0, PREVIEW));
          if (listings.length > PREVIEW) {
            const toggleBtn = document.createElement('button');
            toggleBtn.textContent = 'Alle ' + listings.length + ' Inserate anzeigen';
            toggleBtn.style.cssText = 'margin-top:12px;background:none;border:1px solid #4f46e5;color:#4f46e5;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600';
            let expanded = false;
            toggleBtn.onclick = () => {
              expanded = !expanded;
              renderListings(expanded ? listings : listings.slice(0, PREVIEW));
              toggleBtn.textContent = expanded ? 'Weniger anzeigen ↑' : 'Alle ' + listings.length + ' Inserate anzeigen';
            };
            document.getElementById('listings-section').appendChild(toggleBtn);
          }
        }

        // Ratings
        const ratingsData = rateRes.status === 'fulfilled' ? rateRes.value : null;
        renderRatings(ratingsData);

        // K-166: Show rating form for logged-in founders
        const currentUser = auth.getUser();
        if (currentUser && currentUser.role === 'founder') {
          document.getElementById('rate-form').style.display = 'block';
          initStarPicker();
        }

        // K-184: Portfolio
        const portfolioData = portfolioRes.status === 'fulfilled' ? portfolioRes.value : null;
        if (portfolioData && portfolioData.portfolio && portfolioData.portfolio.length) {
          const section = document.getElementById('portfolio-section');
          const grid2 = document.getElementById('portfolio-grid');
          section.style.display = '';
          grid2.innerHTML = portfolioData.portfolio.map(p =>
            '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden">' +
            (p.image_url ? '<img src="' + p.image_url + '" alt="' + p.title + '" style="width:100%;height:160px;object-fit:cover">' : '') +
            '<div style="padding:14px">' +
            '<div style="font-weight:600;font-size:15px;margin-bottom:6px">' + p.title + '</div>' +
            (p.description ? '<p style="font-size:13px;color:#6b7280;margin:0 0 10px">' + p.description + '</p>' : '') +
            (p.link ? '<a href="' + p.link + '" target="_blank" rel="noopener" style="font-size:13px;color:#6366f1">Mehr erfahren →</a>' : '') +
            '</div></div>'
          ).join('');
        }

        show('profile');
      } catch(e) {
        show('error');
      }
    }

    function renderRatings(ratingsData) {
      const reviews = ratingsData?.ratings || [];
      if (reviews.length) {
        const avg = ratingsData.average || 0;
        const count = ratingsData.count || reviews.length;
        document.getElementById('rating-summary').style.display = 'flex';
        document.getElementById('rating-summary').innerHTML = `
          <div>
            <div class="rating-big">${parseFloat(avg).toFixed(1)}</div>
            <div class="stars">${stars(avg)}</div>
            <div class="rating-count">${count} Bewertung${count !== 1 ? 'en' : ''}</div>
          </div>
        `;
        document.getElementById('reviews-list').innerHTML = reviews.slice(0, 10).map(r => `
          <div class="review-card">
            <div class="review-stars">${stars(r.rating)} <strong>${r.rating}/5</strong>${r.founder_name ? ' <span style="font-size:11px;color:#6b7280;font-weight:400">— ' + r.founder_name + '</span>' : ''}</div>
            ${r.comment ? '<p class="review-text">' + r.comment.replace(/</g,'&lt;') + '</p>' : ''}
            <div class="review-meta">${new Date(r.created_at).toLocaleDateString('de-DE', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
          </div>
        `).join('');
      }
    }

    // K-166: Interactive star picker
    let _selectedStar = 0;
    function initStarPicker() {
      const picker = document.getElementById('star-picker');
      if (!picker) return;
      function renderStars(n) {
        picker.innerHTML = [1,2,3,4,5].map(i =>
          `<span data-v="${i}" style="color:${i<=n?'#f59e0b':'#d1d5db'};cursor:pointer">&#9733;</span>`
        ).join('');
      }
      renderStars(0);
      picker.addEventListener('mouseover', e => {
        const v = parseInt(e.target.dataset.v);
        if (v) renderStars(v);
      });
      picker.addEventListener('mouseout', () => renderStars(_selectedStar));
      picker.addEventListener('click', e => {
        const v = parseInt(e.target.dataset.v);
        if (v) { _selectedStar = v; renderStars(v); }
      });
    }

    async function doSubmitRating() {
      if (!_selectedStar) {
        showRateMsg('Bitte wähle eine Sternebewertung.', '#ef4444');
        return;
      }
      const comment = document.getElementById('rate-comment').value.trim();
      const btn = document.getElementById('rate-submit-btn');
      btn.disabled = true;
      try {
        await ProvidersAPI.submitRating(providerId, _selectedStar, comment || null, null);
        showRateMsg('✓ Bewertung gespeichert!', '#059669');
        document.getElementById('rate-form').style.display = 'none';
        // Refresh ratings
        const fresh = await ProvidersAPI.getRatings(providerId).catch(() => null);
        if (fresh) renderRatings(fresh);
        document.getElementById('ratings-section').style.display = 'block';
      } catch(e) {
        btn.disabled = false;
        showRateMsg('Fehler beim Senden. Bitte erneut versuchen.', '#ef4444');
      }
    }

    function showRateMsg(text, color) {
      const el = document.getElementById('rate-msg');
      el.textContent = text;
      el.style.color = color;
      el.style.display = 'inline';
    }

    function show(view) {
      document.getElementById('skeleton').style.display = 'none';
      document.getElementById('error-state').style.display = view === 'error' ? 'block' : 'none';
      document.getElementById('profile-content').style.display = view === 'profile' ? 'block' : 'none';
    }

    load();
  </script>
</body>
</html>
