<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inserat — Startup Radar</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f3f4f6; color: #1f2937; }
    nav { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    nav h1 { margin: 0; font-size: 18px; }
    nav a { color: #a5b4fc; text-decoration: none; font-size: 14px; }
    nav a:hover { color: #fff; }
    .container { max-width: 800px; margin: 32px auto; padding: 0 20px; }
    .breadcrumb { font-size: 13px; color: #6b7280; margin-bottom: 16px; }
    .breadcrumb a { color: #4f46e5; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .card { background: #fff; border-radius: 10px; padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .title-block h2 { margin: 0 0 8px; font-size: 24px; }
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-type { background: #e0e7ff; color: #3730a3; }
    .badge-geo { background: #d1fae5; color: #065f46; }
    .badge-premium { background: #fef3c7; color: #92400e; }
    .badge-verified { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
    .badge-starter { background: #ede9fe; color: #5b21b6; }
    .tag { background: #f3f4f6; color: #374151; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
    .meta { color: #6b7280; font-size: 14px; margin: 12px 0 0; }
    .stats { display: flex; gap: 20px; margin: 16px 0; font-size: 13px; color: #6b7280; }
    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 20px 0; }
    .description { font-size: 15px; line-height: 1.7; color: #374151; white-space: pre-wrap; }
    .section-label { font-size: 12px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: .05em; margin: 20px 0 8px; }
    .provider-card { background: #f9fafb; border-radius: 8px; padding: 16px 20px; border: 1px solid #e5e7eb; margin-top: 24px; }
    .provider-card h3 { margin: 0 0 4px; font-size: 16px; }
    .provider-card p { margin: 4px 0; font-size: 14px; color: #6b7280; }
    .contact-btn { display: block; width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; text-align: center; }
    .contact-btn:hover { background: #4338ca; }
    .contact-btn:disabled { background: #a5b4fc; cursor: default; }
    .contact-form { display: none; margin-top: 16px; }
    .contact-form textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; resize: vertical; }
    .contact-form button { margin-top: 8px; padding: 10px 24px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .contact-form .cancel { background: #f3f4f6; color: #374151; margin-left: 8px; }
    .msg-sent { color: #059669; font-size: 14px; margin-top: 8px; display: none; }
    .skeleton { background: #e5e7eb; border-radius: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
    .error-state { text-align: center; padding: 60px 20px; color: #6b7280; }
    .error-state h3 { color: #1f2937; }
    .share-row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
    .share-btn { padding: 6px 14px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 13px; cursor: pointer; color: #374151; }
    .share-btn:hover { background: #e5e7eb; }
    @media (max-width: 600px) {
      .card { padding: 18px; }
      .header-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <nav>
    <h1><a href="/" style="color:#fff;text-decoration:none">🚀 Startup Radar</a></h1>
    <a href="founder-dashboard.html" id="back-link">← Zurück zum Radar</a>
  </nav>

  <div class="container">
    <div class="breadcrumb">
      <a href="founder-dashboard.html">Radar</a> / <span id="bc-title">Inserat</span>
    </div>

    <div id="loading" class="card">
      <div class="skeleton" style="height:28px;width:60%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:16px;width:40%;margin-bottom:20px"></div>
      <div class="skeleton" style="height:80px;width:100%"></div>
    </div>

    <div id="listing-detail" style="display:none">
      <div class="card">
        <div class="header-row">
          <div class="title-block">
            <div class="badges" id="detail-badges"></div>
            <h2 id="detail-title"></h2>
            <div class="meta" id="detail-meta"></div>
          </div>
        </div>
        <div class="stats" id="detail-stats"></div>
        <hr class="divider">
        <div class="section-label">Beschreibung</div>
        <div class="description" id="detail-desc"></div>
        <div id="detail-tags-block" style="margin-top:16px"></div>
        <div class="share-row">
          <button class="share-btn" onclick="copyLink()">🔗 Link kopieren</button>
          <span id="copy-msg" style="font-size:13px;color:#059669;display:none">Kopiert!</span>
        </div>
      </div>

      <div class="provider-card" id="provider-block" style="display:none">
        <div class="section-label" style="margin-top:0">Anbieter</div>
        <h3 id="prov-name"></h3>
        <p id="prov-desc"></p>
        <p id="prov-web"></p>
        <div id="prov-verified" style="display:none;margin-top:8px;font-size:13px;color:#065f46;background:#d1fae5;padding:4px 10px;border-radius:6px;display:inline-block">✓ Verifizierter Anbieter</div>
      </div>

      <button class="contact-btn" id="contact-btn" onclick="toggleContact()">Kontakt aufnehmen</button>
      <div class="contact-form" id="contact-form">
        <textarea id="contact-msg" rows="4" placeholder="Kurze Nachricht an den Anbieter (optional)..."></textarea>
        <div>
          <button onclick="sendContact()">Nachricht senden</button>
          <button class="cancel" onclick="toggleContact()">Abbrechen</button>
        </div>
        <div class="msg-sent" id="msg-sent">✓ Nachricht gesendet! Der Anbieter wird benachrichtigt.</div>
      </div>
    </div>

    <div id="error-state" class="card error-state" style="display:none">
      <h3>Inserat nicht gefunden</h3>
      <p>Das Inserat existiert nicht oder wurde entfernt.</p>
      <a href="founder-dashboard.html" style="color:#4f46e5">← Zurück zum Radar</a>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script>
    const listingId = new URLSearchParams(location.search).get('id');

    if (!listingId) {
      showError();
    } else {
      loadListing();
    }

    // Adjust back link based on role
    const user = auth.getUser();
    if (user?.role && user.role !== 'founder') {
      document.getElementById('back-link').href = 'provider-dashboard.html';
      document.getElementById('back-link').textContent = '← Zum Dashboard';
    }

    async function loadListing() {
      try {
        const data = await ListingsAPI.getById(listingId);
        const l = data.listing;
        if (!l) { showError(); return; }

        document.title = l.title + ' — Startup Radar';
        document.getElementById('bc-title').textContent = l.title;

        // Badges
        const badges = [];
        if (l.is_premium) badges.push('<span class="badge badge-premium">⭐ Premium</span>');
        if (l.provider_verified) badges.push('<span class="badge badge-verified">✓ Verifiziert</span>');
        badges.push('<span class="badge badge-type">' + (l.type || '') + '</span>');
        badges.push('<span class="badge badge-geo">' + (l.geo || '') + '</span>');
        if (l.starter_friendly) badges.push('<span class="badge badge-starter">Startup-freundlich</span>');
        document.getElementById('detail-badges').innerHTML = badges.join('');

        document.getElementById('detail-title').textContent = l.title;
        // Show listing image if available
        if (l.image_url) {
          const imgEl = document.createElement('img');
          imgEl.src = l.image_url;
          imgEl.alt = l.title;
          imgEl.style.cssText = 'width:100%;max-height:280px;object-fit:cover;border-radius:8px;margin-bottom:16px';
          imgEl.onerror = () => imgEl.remove();
          document.querySelector('.card').insertBefore(imgEl, document.querySelector('.header-row'));
        }

        const city = l.city ? ' · ' + l.city : '';
        const date = l.created_at ? new Date(l.created_at).toLocaleDateString('de-DE') : '';
        const priceParts = [];
        if (l.hourly_rate) priceParts.push('ab €' + l.hourly_rate + '/Std');
        if (l.daily_rate) priceParts.push('ab €' + l.daily_rate + '/Tag');
        if (l.from_price && !l.hourly_rate && !l.daily_rate) priceParts.push('ab €' + l.from_price);
        const priceStr = priceParts.length ? ' · <strong style="color:#059669">' + priceParts.join(' · ') + '</strong>' : '';
        document.getElementById('detail-meta').innerHTML = (l.type || '') + city + (date ? ' · Eingestellt am ' + date : '') + priceStr;

        document.getElementById('detail-stats').innerHTML =
          '<span>👁 ' + (l.view_count||0) + ' Aufrufe</span>' +
          '<span>💬 ' + (l.contact_count||0) + ' Kontaktanfragen</span>' +
          (l.premium_expires_at ? '<span>⭐ Premium bis ' + new Date(l.premium_expires_at).toLocaleDateString('de-DE') + '</span>' : '');

        document.getElementById('detail-desc').textContent = l.description || 'Keine Beschreibung vorhanden.';

        // Tags
        const tags = Array.isArray(l.tags) ? l.tags : (l.tags ? JSON.parse(l.tags) : []);
        if (tags.length) {
          document.getElementById('detail-tags-block').innerHTML =
            '<div class="section-label">Tags</div>' +
            tags.map(t => '<span class="tag" style="margin-right:4px">' + t + '</span>').join('');
        }

        // Load provider profile
        if (l.provider_id) {
          try {
            const pd = await ProvidersAPI.getProfile(l.provider_id);
            const p = pd.profile;
            if (p) {
              document.getElementById('provider-block').style.display = 'block';
              document.getElementById('prov-name').textContent = p.company_name || 'Anbieter';
              document.getElementById('prov-desc').textContent = p.description || '';
              if (p.website) {
                document.getElementById('prov-web').innerHTML = '<a href="' + p.website + '" target="_blank" rel="noopener" style="color:#4f46e5">' + p.website + '</a>';
              }
              if (p.is_verified) {
                document.getElementById('prov-verified').style.display = 'inline-block';
              }
            }
          } catch(e) { /* provider profile optional */ }
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('listing-detail').style.display = 'block';

        // Hide contact button if not logged in or is own listing
        if (!auth.getToken()) {
          document.getElementById('contact-btn').textContent = 'Einloggen zum Kontaktieren';
          document.getElementById('contact-btn').onclick = () => { location.href = 'auth.html?tab=login'; };
        }
      } catch(e) {
        showError();
      }
    }

    function showError() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-state').style.display = 'block';
    }

    function toggleContact() {
      const form = document.getElementById('contact-form');
      form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    async function sendContact() {
      if (!auth.getToken()) { location.href = 'auth.html?tab=login'; return; }
      const msg = document.getElementById('contact-msg').value.trim();
      try {
        await ListingsAPI.contact(listingId, msg);
        document.getElementById('msg-sent').style.display = 'block';
        document.getElementById('contact-btn').disabled = true;
        document.getElementById('contact-btn').textContent = '✓ Kontakt gesendet';
        setTimeout(() => toggleContact(), 1500);
      } catch(e) {
        alert('Fehler: ' + e.message);
      }
    }

    function copyLink() {
      navigator.clipboard.writeText(location.href).then(() => {
        const msg = document.getElementById('copy-msg');
        msg.style.display = 'inline';
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
      });
    }
  </script>
</body>
</html>
