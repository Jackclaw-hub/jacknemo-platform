<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Startup Radar — Admin</title>
  <style>
    body { font-family: system-ui; max-width: 900px; margin: 0 auto; padding: 20px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 2px solid #dc2626; margin-bottom: 24px; }
    nav h1 { margin: 0; color: #dc2626; }
    nav button { background: none; border: 1px solid #ddd; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin: 12px 0; }
    .listing-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .meta { font-size: 13px; color: #6b7280; margin: 8px 0; }
    .tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    .btn-approve { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-reject { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-approve:hover { background: #059669; }
    .btn-reject:hover { background: #dc2626; }
    input.reason { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; min-width: 200px; }
    .empty { text-align: center; color: #9ca3af; padding: 40px; }
    .status-ok { color: green; margin: 4px 0; font-size: 13px; }
    .status-err { color: red; margin: 4px 0; font-size: 13px; }
    .btn-feature { background: #f59e0b; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-feature:hover { background: #d97706; }
    .btn-feature.unfeatured { background: #6b7280; }
    #summary { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
    .search-filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .search-filter-bar input[type=text] { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .search-filter-bar select { padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; background: #fff; }
    .search-filter-bar button { padding: 7px 14px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .search-filter-bar button.reset-btn { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    /* K-83: Listing detail modal */
    .detail-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; align-items:center; justify-content:center; }
    .detail-modal-overlay.open { display:flex; }
    .detail-modal { background:#fff; border-radius:12px; max-width:600px; width:95vw; max-height:85vh; overflow-y:auto; padding:28px 32px; position:relative; box-shadow:0 8px 40px rgba(0,0,0,.2); }
    .detail-modal h2 { margin:0 0 12px; font-size:20px; }
    .detail-modal .dm-meta { font-size:13px; color:#6b7280; margin-bottom:12px; }
    .detail-modal .dm-desc { font-size:14px; line-height:1.7; white-space:pre-wrap; color:#374151; background:#f9fafb; border-radius:6px; padding:12px; }
    .detail-modal .dm-close { position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; cursor:pointer; color:#9ca3af; }
    .btn-details { background:#f3f4f6; color:#374151; border:1px solid #d1d5db; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px; }
    .btn-details:hover { background:#e5e7eb; }

    /* K-23: Mobile responsive */
    @media (max-width: 640px) {
      body { padding: 12px; }
      nav { flex-direction: column; align-items: flex-start; gap: 8px; }
      nav div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      nav h1 { font-size: 16px; }
      .filters, .search-bar { flex-direction: column; }
      .filters select, .filters input { width: 100%; box-sizing: border-box; }
      .search-bar input, .search-bar button { width: 100%; box-sizing: border-box; }
      .card { padding: 14px; }
      .score-badge { position: static; display: inline-block; margin-top: 8px; }
      .contact-btn, .action-btn, button[type=submit] { width: 100%; padding: 12px; font-size: 15px; box-sizing: border-box; }
      input[type=text], input[type=email], input[type=password], textarea, select { width: 100%; box-sizing: border-box; }
      .grid, .kpi-grid { grid-template-columns: 1fr !important; }
      table { font-size: 12px; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <nav>
    <h1>🛡 Admin Dashboard</h1>
    <div><a href="admin-analytics.html" style="background:#7c3aed;color:white;text-decoration:none;padding:8px 16px;border-radius:4px;font-size:13px;margin-right:8px">&#128202; Analytics</a><span id="user-name"></span> <button id="bell-btn" onclick="toggleNotifPanel()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;position:relative;padding:0 4px;vertical-align:middle;margin-right:6px" title="Benachrichtigungen"><span id="bell-icon">🔔</span><span id="notif-count" style="display:none;position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:50%;font-size:10px;padding:1px 4px;font-weight:700"></span></button><button onclick="logout()">Logout</button></div>
  </nav>

  <div style="display:flex;gap:8px;margin-bottom:16px;border-bottom:2px solid #e5e7eb;padding-bottom:8px">
    <button id="tab-listings" onclick="showTab('listings')" style="background:#dc2626;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px">Listings pending</button>
    <button id="tab-verify" onclick="showTab('verify')" style="background:#e5e7eb;color:#374151;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px">Verification queue</button>
    <!-- K-65: Users tab -->
    <button id="tab-users" onclick="showTab('users')" style="background:#e5e7eb;color:#374151;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px">User Management</button>
    <!-- K-67: Reports tab -->
    <button id="tab-reports" onclick="showTab('reports')" style="background:#e5e7eb;color:#374151;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px">Meldungen</button>
    <!-- K-66: CSV exports -->
    <div style="margin-left:auto;display:flex;gap:8px">
      <button onclick="downloadCSV('listings')" style="background:#f9fafb;border:1px solid #d1d5db;color:#374151;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px">&#11015; Listings CSV</button>
      <button onclick="downloadCSV('users')" style="background:#f9fafb;border:1px solid #d1d5db;color:#374151;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px">&#11015; Users CSV</button>
    </div>
  </div>
  <!-- K-60: Search & filter panel -->
  <div class="search-filter-bar" id="search-filter-bar">
    <input type="text" id="admin-search" placeholder="Suche nach Titel, Stadt…" oninput="debounceSearch()">
    <select id="filter-status" onchange="applyFilters()">
      <option value="pending">Ausstehend</option>
      <option value="active">Aktiv</option>
      <option value="rejected">Abgelehnt</option>
      <option value="expired">Abgelaufen</option>
      <option value="draft">Entwurf</option>
      <option value="all">Alle Status</option>
    </select>
    <select id="filter-type" onchange="applyFilters()">
      <option value="">Alle Typen</option>
      <option value="equipment">Equipment</option>
      <option value="service">Service</option>
    </select>
    <button class="reset-btn" onclick="resetFilters()">Zurücksetzen</button>
  </div>
  <div id="summary">Lade ausstehende Inserate...</div>

  <!-- K-115: Bulk action bar — shown when ≥1 checkbox checked -->
  <div id="bulk-bar" style="display:none;position:sticky;top:0;z-index:100;background:#1e1b4b;color:#fff;border-radius:8px;padding:10px 16px;margin-bottom:12px;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.2)">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;user-select:none">
      <input type="checkbox" id="select-all-cb" onchange="toggleSelectAll(this.checked)" style="width:16px;height:16px;cursor:pointer">
      Alle auswählen
    </label>
    <span id="bulk-count" style="font-size:13px;font-weight:700;flex:1"></span>
    <button onclick="bulkApprove()" style="background:#10b981;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">✓ Alle genehmigen</button>
    <button onclick="bulkReject()" style="background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">✗ Alle ablehnen</button>
    <button onclick="clearSelection()" style="background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px">Auswahl aufheben</button>
  </div>

  <div id="listings"></div>
  <div id="verify-section" style="display:none">
    <div id="verify-summary"></div>
    <div id="verify-list"></div>
  </div>
  <!-- K-67: Reports section -->
  <div id="reports-section" style="display:none">
    <div id="reports-summary" style="font-size:13px;color:#6b7280;margin-bottom:10px"></div>
    <div id="reports-list"></div>
  </div>
  <!-- K-65: User management section -->
  <div id="users-section" style="display:none">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <input type="text" id="user-search" placeholder="E-Mail oder Name suchen..." oninput="debounceUserSearch()" style="padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;width:220px">
      <select id="user-role-filter" onchange="loadUsers()" style="padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
        <option value="">Alle Rollen</option>
        <option value="founder">Founder</option>
        <option value="provider">Provider</option>
        <option value="admin">Admin</option>
      </select>
      <select id="user-active-filter" onchange="loadUsers()" style="padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
        <option value="">Alle Status</option>
        <option value="true">Aktiv</option>
        <option value="false">Deaktiviert</option>
      </select>
    </div>
    <div id="users-summary" style="font-size:13px;color:#6b7280;margin-bottom:10px"></div>
    <div id="users-list"></div>
  </div>

  <script src="api-client.js"></script>
  <script>
    redirectIfNotLoggedIn();
    const user = auth.getUser();
    if (user?.role !== 'admin') {
      document.body.innerHTML = '<p style="color:red;padding:40px">Kein Zugriff. Nur Admins.</p>';
    }
    document.getElementById('user-name').textContent = user?.name || user?.email || '';


    // K-53: Notification center
    let notifPanelOpen = false;
    async function loadNotifications() {
      if (!auth.getToken()) return;
      try {
        const data = await NotificationsAPI.getAll();
        const count = data.unread || 0;
        const badge = document.getElementById('notif-count');
        if (badge) { badge.textContent = count > 9 ? '9+' : String(count); badge.style.display = count > 0 ? 'block' : 'none'; }
        if (notifPanelOpen) renderNotifList(data.notifications || []);
      } catch(e) {}
    }
    function renderNotifList(notifications) {
      const el = document.getElementById('notif-list');
      if (!el) return;
      if (!notifications.length) { el.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:24px;font-size:14px">Keine Benachrichtigungen</p>'; return; }
      el.innerHTML = notifications.map(n =>
        '<div style="padding:12px 16px;border-bottom:1px solid #f9fafb;background:' + (n.read_at ? '#fff' : '#f0f4ff') + ';cursor:pointer" onclick="readNotif(' + n.id + ', this)">' +
        '<div style="font-size:13px;font-weight:600;color:#1f2937">' + (n.subject||'') + '</div>' +
        '<div style="font-size:12px;color:#6b7280;margin-top:2px">' + (n.body||'').slice(0,80) + ((n.body||'').length>80?'…':'') + '</div>' +
        '<div style="font-size:11px;color:#9ca3af;margin-top:4px">' + new Date(n.created_at).toLocaleDateString('de-DE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) + '</div>' +
        '</div>'
      ).join('');
    }
    function toggleNotifPanel() {
      const panel = document.getElementById('notif-panel');
      if (notifPanelOpen) { panel.style.display = 'none'; notifPanelOpen = false; }
      else {
        panel.style.display = 'flex'; notifPanelOpen = true;
        NotificationsAPI.getAll().then(d => { renderNotifList(d.notifications||[]); const b=document.getElementById('notif-count'); if(b) b.style.display='none'; }).catch(()=>{});
      }
    }
    function closeNotifPanel() { document.getElementById('notif-panel').style.display = 'none'; notifPanelOpen = false; }
    async function readNotif(id, el) { el.style.background = '#fff'; try { await NotificationsAPI.markRead(id); } catch(e) {} }
    async function markAllRead() {
      try { await NotificationsAPI.markAllRead(); document.querySelectorAll('#notif-list > div').forEach(el => el.style.background='#fff'); const b=document.getElementById('notif-count'); if(b) b.style.display='none'; } catch(e) {}
    }

    function logout() { AuthAPI.logout(); location.href = 'auth.html'; }

    function renderListing(l) {
      return `<div class="card" id="card-${l.id}">
        <div class="listing-header" style="display:flex;align-items:flex-start;gap:10px">
          <input type="checkbox" class="bulk-cb" value="${l.id}" onclick="updateBulkBar()" style="margin-top:4px;width:16px;height:16px;cursor:pointer">
          <div style="flex:1">
          <h3 style="margin:0">${l.title}</h3>
          <span style="font-size:12px;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:12px">${l.status}</span>
        </div>
        <div class="meta">
          Typ: <strong>${l.type}</strong> · Geo: <strong>${l.geo}</strong>
          ${l.city ? '· Stadt: <strong>' + l.city + '</strong>' : ''}
          · Provider ID: ${l.provider_id}
          <!-- K-124: provider email chip filled async -->
          <span id="prov-email-${l.provider_id}" style="display:none;background:#f3f4f6;color:#6b7280;font-size:11px;padding:1px 7px;border-radius:8px;margin-left:4px"></span>
        </div>
        <div>${(l.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="actions">
          <button class="btn-approve" onclick="approve(${l.id})">✓ Genehmigen</button>
          <input class="reason" type="text" id="reason-${l.id}" placeholder="Ablehnungsgrund (optional)">
          <button class="btn-reject" onclick="reject(${l.id})">✗ Ablehnen</button>
          <button class="btn-feature ${l.is_featured ? '' : 'unfeatured'}" onclick="toggleFeature(${l.id}, ${l.is_featured ? 1 : 0})">${l.is_featured ? '\u2B50 Unfeature' : '\u2606 Feature'}</button>
          <button class="btn-details" onclick="showListingDetail(${l.id})">&#128269; Details</button>
        </div>
        </div>
        <div id="msg-${l.id}"></div>
      </div>`;
    }

    async function approve(id) {
      try {
        await AdminAPI.approve(id);
        const msg = document.getElementById('msg-' + id);
        msg.innerHTML = '<div class="status-ok">✓ Genehmigt</div>';
        document.querySelector('#card-' + id + ' .btn-approve').disabled = true;
        document.querySelector('#card-' + id + ' .btn-reject').disabled = true;
        loadPending();
      } catch(ex) {
        document.getElementById('msg-' + id).innerHTML = '<div class="status-err">Fehler: ' + ex.message + '</div>';
      }
    }

    async function reject(id) {
      const reason = document.getElementById('reason-' + id)?.value || '';
      try {
        await AdminAPI.reject(id, reason);
        const msg = document.getElementById('msg-' + id);
        msg.innerHTML = '<div class="status-err">✗ Abgelehnt</div>';
        document.querySelector('#card-' + id + ' .btn-approve').disabled = true;
        document.querySelector('#card-' + id + ' .btn-reject').disabled = true;
        loadPending();
      } catch(ex) {
        document.getElementById('msg-' + id).innerHTML = '<div class="status-err">Fehler: ' + ex.message + '</div>';
      }
    }

    async function toggleFeature(id, isFeatured) {
      try {
        if (isFeatured) await AdminAPI.unfeature(id);
        else await AdminAPI.feature(id);
        loadPending();
      } catch(ex) { alert('Error: ' + ex.message); }
    }

    function showTab(tab) {
      document.getElementById('listings').style.display = tab === 'listings' ? '' : 'none';
      document.getElementById('summary').style.display = tab === 'listings' ? '' : 'none';
      document.getElementById('search-filter-bar').style.display = tab === 'listings' ? 'flex' : 'none';
      document.getElementById('verify-section').style.display = tab === 'verify' ? '' : 'none';
      document.getElementById('users-section').style.display = tab === 'users' ? '' : 'none';
      document.getElementById('reports-section').style.display = tab === 'reports' ? '' : 'none';
      const tabs = { listings: '#dc2626', verify: '#7c3aed', users: '#0891b2', reports: '#d97706' };
      ['listings', 'verify', 'users', 'reports'].forEach(t => {
        document.getElementById('tab-' + t).style.cssText = tab === t
          ? `background:${tabs[t]};color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px`
          : 'background:#e5e7eb;color:#374151;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px';
      });
      if (tab === 'verify') loadVerificationQueue();
      if (tab === 'users') loadUsers();
      if (tab === 'reports') loadReports();
    }

    // K-67: Abuse reports
    async function loadReports() {
      const listEl = document.getElementById('reports-list');
      const sumEl = document.getElementById('reports-summary');
      listEl.innerHTML = '<div class="empty">Lade Meldungen…</div>';
      try {
        const data = await api('GET', '/admin/reports', null, auth.getToken());
        const groups = data.groups || [];
        sumEl.textContent = data.total + ' offene Meldungen in ' + groups.length + ' Inseraten';
        if (!groups.length) { listEl.innerHTML = '<div class="empty">Keine offenen Meldungen ✓</div>'; return; }
        listEl.innerHTML = groups.map(g => `
          <div class="card" id="rgroup-${g.listing_id}" style="border-left:3px solid #d97706">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <h3 style="margin:0 0 4px;font-size:14px">${g.listing_title || 'Inserat #' + g.listing_id}</h3>
                <div class="meta">ID: ${g.listing_id} · Status: ${g.listing_status || '—'} · <strong>${g.count} Meldung(en)</strong></div>
                <div style="margin-top:6px;font-size:12px;color:#6b7280">${(g.reports||[]).map(r => `<span style="background:#fff7ed;padding:2px 6px;border-radius:4px;margin-right:4px" title="${r.reporter_email || 'Nutzer #' + r.reporter_id}">${r.reason}${r.reporter_email ? ' · <em>' + r.reporter_email + '</em>' : ''}</span>`).join('')}</div>
              </div>
              <div style="display:flex;gap:8px;flex-shrink:0">
                <a href="listing.html?id=${g.listing_id}" target="_blank" style="font-size:12px;color:#4f46e5;padding:5px 10px;border:1px solid #4f46e5;border-radius:4px;text-decoration:none">Ansehen</a>
                <button onclick="dismissGroup(${g.listing_id}, [${(g.reports||[]).map(r=>r.id).join(',')}])" style="background:#059669;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px">Alle schließen</button>
              </div>
            </div>
          </div>`).join('');
      } catch(e) {
        listEl.innerHTML = '<div class="empty">Fehler: ' + e.message + '</div>';
      }
    }

    async function dismissGroup(listingId, reportIds) {
      try {
        await Promise.all(reportIds.map(id => api('PATCH', '/admin/reports/' + id + '/dismiss', {}, auth.getToken())));
        document.getElementById('rgroup-' + listingId)?.remove();
      } catch(e) { alert('Fehler: ' + e.message); }
    }

    // K-65: User management
    let userSearchTimer;
    function debounceUserSearch() {
      clearTimeout(userSearchTimer);
      userSearchTimer = setTimeout(loadUsers, 350);
    }

    async function loadUsers() {
      const search = document.getElementById('user-search').value.trim();
      const role = document.getElementById('user-role-filter').value;
      const is_active = document.getElementById('user-active-filter').value;
      const filters = {};
      if (search) filters.search = search;
      if (role) filters.role = role;
      if (is_active !== '') filters.is_active = is_active;
      const listEl = document.getElementById('users-list');
      const sumEl = document.getElementById('users-summary');
      listEl.innerHTML = '<div class="empty">Lade Benutzer…</div>';
      try {
        const data = await AdminAPI.getUsers(filters);
        const users = data.users || [];
        sumEl.textContent = data.total + ' Benutzer gefunden';
        if (!users.length) { listEl.innerHTML = '<div class="empty">Keine Benutzer gefunden</div>'; return; }
        listEl.innerHTML = `
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr style="background:#f9fafb;text-align:left">
              <th style="padding:8px 10px;border-bottom:1px solid #e5e7eb">ID</th>
              <th style="padding:8px 10px;border-bottom:1px solid #e5e7eb">E-Mail</th>
              <th style="padding:8px 10px;border-bottom:1px solid #e5e7eb">Name</th>
              <th style="padding:8px 10px;border-bottom:1px solid #e5e7eb">Rolle</th>
              <th style="padding:8px 10px;border-bottom:1px solid #e5e7eb">Status</th>
              <th style="padding:8px 10px;border-bottom:1px solid #e5e7eb">Registriert</th>
              <th style="padding:8px 10px;border-bottom:1px solid #e5e7eb">Aktionen</th>
            </tr></thead>
            <tbody>${users.map(u => `
              <tr id="urow-${u.id}" style="border-bottom:1px solid #f3f4f6">
                <td style="padding:8px 10px;color:#9ca3af">${u.id}</td>
                <td style="padding:8px 10px">${u.email}</td>
                <td style="padding:8px 10px">${u.name || '—'}</td>
                <td style="padding:8px 10px"><span style="background:${u.role==='admin'?'#fef3c7':u.role==='provider'?'#dbeafe':'#f0fdf4'};color:${u.role==='admin'?'#92400e':u.role==='provider'?'#1e40af':'#166534'};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">${u.role}</span></td>
                <td style="padding:8px 10px"><span style="background:${u.is_active!==false?'#dcfce7':'#fee2e2'};color:${u.is_active!==false?'#166534':'#991b1b'};padding:2px 8px;border-radius:10px;font-size:11px">${u.is_active!==false?'Aktiv':'Deaktiviert'}</span></td>
                <td style="padding:8px 10px;color:#6b7280">${u.created_at ? new Date(u.created_at).toLocaleDateString('de-DE') : '—'}</td>
                <td style="padding:8px 10px;display:flex;gap:6px;align-items:center" id="uact-${u.id}">
                  ${u.is_active !== false
                    ? `<button onclick="toggleUser(${u.id},false)" style="background:#dc2626;color:white;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px">Deaktivieren</button>`
                    : `<button onclick="toggleUser(${u.id},true)" style="background:#059669;color:white;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px">Aktivieren</button>`
                  }
                  <button class="btn-details" onclick="showUserDetail(${u.id})">&#128269; Details</button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>`;
      } catch(e) {
        listEl.innerHTML = '<div class="empty">Fehler: ' + e.message + '</div>';
      }
    }

    async function toggleUser(id, enable) {
      const label = enable ? 'aktivieren' : 'deaktivieren';
      if (!confirm(`Konto wirklich ${label}?`)) return;
      try {
        if (enable) await AdminAPI.enableUser(id);
        else await AdminAPI.disableUser(id);
        loadUsers();
      } catch(e) {
        alert('Fehler: ' + e.message);
      }
    }

    // K-37: Verification queue
    async function loadVerificationQueue() {
      const sum = document.getElementById('verify-summary');
      const list = document.getElementById('verify-list');
      sum.textContent = 'Loading...';
      try {
        const data = await api('GET', '/admin/providers/pending-verification', null, auth.getToken());
        const providers = data.providers || [];
        sum.textContent = providers.length + ' provider(s) awaiting verification';
        if (!providers.length) {
          list.innerHTML = '<div class="empty">No pending verifications ✓</div>';
          return;
        }
        list.innerHTML = providers.map(p => `
          <div class="card" id="vcard-${p.user_id}">
            <h3 style="margin:0 0 4px">${p.company_name || p.name || 'Unknown'}</h3>
            <div class="meta">Email: <strong>${p.email}</strong> · Requested: ${p.verification_requested_at ? new Date(p.verification_requested_at).toLocaleDateString() : '—'}</div>
            <div class="actions" style="margin-top:10px">
              <button onclick="verifyProvider(${p.user_id}, true)" style="background:#059669;color:white;border:none;padding:7px 16px;border-radius:4px;cursor:pointer;margin-right:8px">✓ Approve</button>
              <button onclick="verifyProvider(${p.user_id}, false)" style="background:#dc2626;color:white;border:none;padding:7px 16px;border-radius:4px;cursor:pointer">✗ Reject</button>
            </div>
          </div>`).join('');
      } catch(e) {
        sum.textContent = 'Error: ' + e.message;
      }
    }

    async function verifyProvider(userId, approve) {
      try {
        await api('PATCH', '/admin/providers/' + userId + '/verify', { approve }, auth.getToken());
        const card = document.getElementById('vcard-' + userId);
        if (card) {
          card.style.opacity = '0.5';
          card.querySelector('.actions').innerHTML = approve
            ? '<span style="color:#059669;font-weight:600">✓ Approved</span>'
            : '<span style="color:#dc2626;font-weight:600">✗ Rejected</span>';
        }
      } catch(e) { alert('Error: ' + e.message); }
    }


    function updateBulkBar() {
      const checked = document.querySelectorAll('.bulk-cb:checked');
      const bar = document.getElementById('bulk-bar');
      const countEl = document.getElementById('bulk-count');
      if (checked.length > 0) {
        bar.style.display = 'flex';
        countEl.textContent = checked.length + ' ausgewählt';
      } else {
        bar.style.display = 'none';
      }
    }

    function clearSelection() {
      document.querySelectorAll('.bulk-cb').forEach(cb => { cb.checked = false; });
      const sa = document.getElementById('select-all-cb');
      if (sa) sa.checked = false;
      document.getElementById('bulk-bar').style.display = 'none';
    }

    function toggleSelectAll(checked) {
      document.querySelectorAll('.bulk-cb').forEach(cb => { cb.checked = checked; });
      updateBulkBar();
    }

    async function bulkApprove() {
      const ids = Array.from(document.querySelectorAll('.bulk-cb:checked')).map(cb => parseInt(cb.value));
      if (!ids.length) return;
      if (!confirm('Wirklich ' + ids.length + ' Inserate genehmigen?')) return;
      try {
        const r = await AdminAPI.bulkAction(ids, 'approve');
        alert(r.message);
        clearSelection();
        loadPending();
      } catch(e) { alert('Fehler: ' + e.message); }
    }

    async function bulkReject() {
      const ids = Array.from(document.querySelectorAll('.bulk-cb:checked')).map(cb => parseInt(cb.value));
      if (!ids.length) return;
      const reason = prompt('Ablehnungsgrund (optional):') || '';
      if (reason === null) return; // cancelled
      try {
        const r = await AdminAPI.bulkAction(ids, 'reject', reason);
        alert(r.message);
        clearSelection();
        loadPending();
      } catch(e) { alert('Fehler: ' + e.message); }
    }

    // K-129: Batch-load report flags after listing cards are rendered
    async function loadReportFlags(listings) {
      try {
        const data = await api('GET', '/admin/reports', null, auth.getToken());
        const groups = data.groups || [];
        if (!groups.length) return;
        const countMap = {};
        groups.forEach(g => { countMap[g.listing_id] = g.count || 0; });
        listings.forEach(l => {
          const count = countMap[l.id];
          if (!count) return;
          const card = document.getElementById('card-' + l.id);
          if (!card) return;
          const h3 = card.querySelector('h3');
          if (!h3) return;
          const badge = document.createElement('span');
          badge.title = count + ' offene Meldung(en) — zum Meldungen-Tab wechseln';
          badge.style.cssText = 'background:#fee2e2;color:#991b1b;font-size:11px;padding:1px 7px;border-radius:8px;margin-left:6px;cursor:pointer;font-weight:600';
          badge.textContent = '🚩 ' + count;
          badge.onclick = () => showTab('reports');
          h3.appendChild(badge);
        });
      } catch(_) { /* report flags are optional */ }
    }

    // K-124: Batch-load provider emails after listing cards are rendered
    const _emailCache = {};
    async function loadProviderEmails(listings) {
      const uniqueIds = [...new Set(listings.map(l => l.provider_id).filter(Boolean))];
      await Promise.allSettled(uniqueIds.map(async (id) => {
        if (_emailCache[id] !== undefined) {
          fillProviderEmail(id, _emailCache[id]);
          return;
        }
        try {
          const data = await api('GET', '/admin/users/' + id, null, auth.getToken());
          const email = data.user?.email || null;
          _emailCache[id] = email;
          fillProviderEmail(id, email);
        } catch(_) { _emailCache[id] = null; }
      }));
    }
    function fillProviderEmail(providerId, email) {
      if (!email) return;
      const el = document.getElementById('prov-email-' + providerId);
      if (el) { el.textContent = email; el.style.display = 'inline'; }
    }

    // K-60: Search/filter
    let searchTimer = null;
    function debounceSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applyFilters, 300);
    }

    async function applyFilters() {
      const status = document.getElementById('filter-status').value;
      const type = document.getElementById('filter-type').value;
      const search = document.getElementById('admin-search').value.trim();
      await loadListings({ status, type: type || undefined, search: search || undefined });
    }

    function resetFilters() {
      document.getElementById('filter-status').value = 'pending';
      document.getElementById('filter-type').value = '';
      document.getElementById('admin-search').value = '';
      loadListings({ status: 'pending' });
    }

    async function loadListings(filters = { status: 'pending' }) {
      try {
        const data = await AdminAPI.getListings(filters);
        const listings = data.listings || data;
        const el = document.getElementById('listings');
        const statusLabel = filters.status === 'all' ? 'alle' : filters.status || 'ausstehende';
        document.getElementById('summary').textContent = listings.length + ' ' + statusLabel + ' Inserate';
        if (!listings.length) {
          el.innerHTML = '<div class="empty">Keine Inserate gefunden 🎉</div>';
        } else {
          el.innerHTML = listings.map(renderListing).join('');
          loadProviderEmails(listings); // K-124: async fill provider emails
          loadReportFlags(listings);    // K-129: async inject report flag badges
        }
        // K-115: reset bulk bar on reload
        const sa = document.getElementById('select-all-cb');
        if (sa) sa.checked = false;
        document.getElementById('bulk-bar').style.display = 'none';
      } catch(ex) {
        document.getElementById('summary').textContent = 'Fehler beim Laden: ' + ex.message;
      }
    }

    async function loadPending() {
      await loadListings({ status: 'pending' });
    }

    // K-66: CSV export download
    async function downloadCSV(type) {
      const token = auth.getToken();
      const url = '/api/admin/export/' + type + '.csv';
      try {
        const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = type + '-export.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      } catch(e) {
        alert('Export fehlgeschlagen: ' + e.message);
      }
    }

    async function showListingDetail(id) {
      const overlay = document.getElementById('detail-modal-overlay');
      const body = document.getElementById('dm-body');
      body.innerHTML = '<p style="color:#6b7280;text-align:center;padding:20px">Lade...</p>';
      overlay.classList.add('open');
      try {
        const data = await api('GET', '/admin/listings/' + id + '/detail', null, auth.getToken()); // K-126
        const l = data.listing || data;
        const tags = (l.tags || []).map(t => `<span class="tag">${t}</span>`).join(' ') || '—';
        const expires = l.expires_at ? new Date(l.expires_at).toLocaleDateString('de-DE') : '—';
        const created = l.created_at ? new Date(l.created_at).toLocaleDateString('de-DE') : '—';
        // Pricing
        const pricing = [];
        if (l.hourly_rate) pricing.push('€' + l.hourly_rate + '/Std');
        if (l.daily_rate)  pricing.push('€' + l.daily_rate  + '/Tag');
        if (l.from_price)  pricing.push('ab €' + l.from_price);
        const pricingHtml = pricing.length ? pricing.join(' · ') : '—';
        // Flags
        const flags = [];
        if (l.is_premium)  flags.push('<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-size:12px">⭐ Premium</span>');
        if (l.is_featured) flags.push('<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-size:12px">✨ Featured</span>');
        if (l.starter_friendly) flags.push('<span style="background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:10px;font-size:12px">🌱 Starter</span>');
        // Stages / sectors
        const stages = Array.isArray(l.stages) ? l.stages.join(', ') : (l.stages || '—');
        const sectors = Array.isArray(l.sectors) ? l.sectors.join(', ') : (l.sectors || '—');
        body.innerHTML = `
          <h2>${l.title}</h2>
          ${flags.length ? '<div style="margin-bottom:8px">' + flags.join(' ') + '</div>' : ''}
          <div class="dm-meta">
            ID: <strong>${l.id}</strong> &nbsp;·&nbsp;
            Status: <span class="badge badge-${l.status}">${l.status}</span> &nbsp;·&nbsp;
            Typ: <strong>${l.type}</strong>
            <br>Geo: <strong>${l.geo}</strong>${l.city ? ' &nbsp;·&nbsp; Stadt: <strong>' + l.city + '</strong>' : ''}
            <br>Provider ID: <strong>${l.provider_id}</strong>${l.provider_email ? ' &nbsp;<span style="background:#f3f4f6;color:#6b7280;font-size:11px;padding:1px 7px;border-radius:8px">' + l.provider_email + '</span>' : ''} &nbsp;·&nbsp;
            Erstellt: <strong>${created}</strong> &nbsp;·&nbsp;
            Läuft ab: <strong>${expires}</strong>
            ${l.rejection_reason ? '<br><span style="color:#991b1b;font-size:12px">⚠ Abgelehnt: ' + l.rejection_reason + '</span>' : ''}
            ${l.report_count > 0 ? '<br><span style="color:#b45309;font-size:12px">🚩 ' + l.report_count + ' offene Meldung(en)</span>' : ''}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;font-size:13px">
            <div style="background:#f3f4f6;border-radius:6px;padding:8px 12px"><span style="color:#6b7280">👁 Views</span><br><strong>${l.view_count || 0}</strong></div>
            <div style="background:#f3f4f6;border-radius:6px;padding:8px 12px"><span style="color:#6b7280">📬 Kontakte</span><br><strong>${l.contact_count || 0}</strong></div>
            <div style="background:#f3f4f6;border-radius:6px;padding:8px 12px"><span style="color:#6b7280">💶 Preise</span><br><strong>${pricingHtml}</strong></div>
            <div style="background:#f3f4f6;border-radius:6px;padding:8px 12px"><span style="color:#6b7280">🎯 Stages</span><br><strong>${stages}</strong></div>
          </div>
          ${sectors !== '—' ? '<div style="font-size:13px;margin-bottom:8px"><span style="color:#6b7280">Sektoren:</span> <strong>' + sectors + '</strong></div>' : ''}
          <div style="margin-bottom:10px">${tags}</div>
          <div class="dm-desc">${l.description || '(keine Beschreibung)'}</div>
          <div style="margin-top:12px;display:flex;gap:8px">
            <a href="listing.html?id=${l.id}" target="_blank" style="font-size:13px;color:#4f46e5;border:1px solid #4f46e5;padding:5px 12px;border-radius:4px;text-decoration:none">Öffnen →</a>
          </div>
        `;
      } catch(ex) {
        body.innerHTML = '<p style="color:#ef4444;padding:8px">Fehler: ' + ex.message + '</p>';
      }
    }

    function closeDetailModal() {
      document.getElementById('detail-modal-overlay').classList.remove('open');
    }

    // K-87: Admin user detail modal
    async function showUserDetail(id) {
      const overlay = document.getElementById('user-detail-modal-overlay');
      const body = document.getElementById('udm-body');
      body.innerHTML = '<p style="color:#6b7280;text-align:center;padding:20px">Lade...</p>';
      overlay.classList.add('open');
      try {
        const data = await api('GET', '/admin/users/' + id, null, auth.getToken());
        const u = data.user;
        const created = u.created_at ? new Date(u.created_at).toLocaleDateString('de-DE') : '—';
        const roleColor = u.role === 'admin' ? '#92400e' : u.role === 'provider' ? '#1e40af' : '#166534';
        const roleBackground = u.role === 'admin' ? '#fef3c7' : u.role === 'provider' ? '#dbeafe' : '#f0fdf4';
        const statusColor = u.is_active !== false ? '#166534' : '#991b1b';
        const statusBg = u.is_active !== false ? '#dcfce7' : '#fee2e2';
        body.innerHTML = `
          <h2>${u.name || u.email}</h2>
          <div class="dm-meta">
            ID: <strong>${u.id}</strong> &nbsp;·&nbsp;
            Registriert: <strong>${created}</strong>
            <br>
            <span style="background:${roleBackground};color:${roleColor};padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600">${u.role}</span>
            &nbsp;
            <span style="background:${statusBg};color:${statusColor};padding:2px 8px;border-radius:10px;font-size:11px">${u.is_active !== false ? 'Aktiv' : 'Deaktiviert'}</span>
          </div>
          <div class="dm-desc">
E-Mail: ${u.email}
Name: ${u.name || '—'}
Inserate: ${u.listing_count || 0}
Referral-Code: ${u.referral_code || '—'}
Empfohlen von: ${u.referred_by || '—'}
E-Mail verifiziert: ${u.email_verified ? 'Ja' : 'Nein'}
          </div>
        `;
      } catch(ex) {
        body.innerHTML = '<p style="color:#ef4444;padding:8px">Fehler: ' + ex.message + '</p>';
      }
    }

    function closeUserDetailModal() {
      document.getElementById('user-detail-modal-overlay').classList.remove('open');
    }

    loadPending();
  </script>

  <!-- K-83: Listing detail modal -->
  <div class="detail-modal-overlay" id="detail-modal-overlay" onclick="if(event.target===this)closeDetailModal()">
    <div class="detail-modal">
      <button class="dm-close" onclick="closeDetailModal()">&#x2715;</button>
      <div id="dm-body"></div>
    </div>
  </div>

  <!-- K-87: User detail modal -->
  <div class="detail-modal-overlay" id="user-detail-modal-overlay" onclick="if(event.target===this)closeUserDetailModal()">
    <div class="detail-modal">
      <button class="dm-close" onclick="closeUserDetailModal()">&#x2715;</button>
      <div id="udm-body"></div>
    </div>
  </div>

  <!-- K-53: Notification panel -->
  <div id="notif-panel" style="display:none;position:fixed;top:52px;right:16px;width:340px;max-width:95vw;max-height:480px;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.16);z-index:999;overflow:hidden;flex-direction:column">
    <div style="padding:14px 16px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between">
      <strong style="font-size:15px">Benachrichtigungen</strong>
      <div style="display:flex;gap:8px;align-items:center">
        <button onclick="markAllRead()" style="font-size:12px;color:#4f46e5;background:none;border:none;cursor:pointer;padding:0">Alle gelesen</button>
        <button onclick="closeNotifPanel()" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:16px">✕</button>
      </div>
    </div>
    <div id="notif-list" style="overflow-y:auto;max-height:400px;padding:0"></div>
  </div>
</body>
</html>
