<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Startup Radar — Admin</title>
  <style>
    body { font-family: system-ui; max-width: 900px; margin: 0 auto; padding: 20px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 2px solid #dc2626; margin-bottom: 24px; }
    nav h1 { margin: 0; color: #dc2626; }
    nav button { background: none; border: 1px solid #ddd; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin: 12px 0; }
    .listing-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .meta { font-size: 13px; color: #6b7280; margin: 8px 0; }
    .tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
    .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    .btn-approve { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-reject { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-approve:hover { background: #059669; }
    .btn-reject:hover { background: #dc2626; }
    input.reason { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; min-width: 200px; }
    .empty { text-align: center; color: #9ca3af; padding: 40px; }
    .status-ok { color: green; margin: 4px 0; font-size: 13px; }
    .status-err { color: red; margin: 4px 0; font-size: 13px; }
    .btn-feature { background: #f59e0b; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .btn-feature:hover { background: #d97706; }
    .btn-feature.unfeatured { background: #6b7280; }
    #summary { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
    .search-filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .search-filter-bar input[type=text] { flex: 1; min-width: 180px; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
    .search-filter-bar select { padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; background: #fff; }
    .search-filter-bar button { padding: 7px 14px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .search-filter-bar button.reset-btn { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
  
    /* K-23: Mobile responsive */
    @media (max-width: 640px) {
      body { padding: 12px; }
      nav { flex-direction: column; align-items: flex-start; gap: 8px; }
      nav div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      nav h1 { font-size: 16px; }
      .filters, .search-bar { flex-direction: column; }
      .filters select, .filters input { width: 100%; box-sizing: border-box; }
      .search-bar input, .search-bar button { width: 100%; box-sizing: border-box; }
      .card { padding: 14px; }
      .score-badge { position: static; display: inline-block; margin-top: 8px; }
      .contact-btn, .action-btn, button[type=submit] { width: 100%; padding: 12px; font-size: 15px; box-sizing: border-box; }
      input[type=text], input[type=email], input[type=password], textarea, select { width: 100%; box-sizing: border-box; }
      .grid, .kpi-grid { grid-template-columns: 1fr !important; }
      table { font-size: 12px; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <nav>
    <h1>🛡 Admin Dashboard</h1>
    <div><a href="admin-analytics.html" style="background:#7c3aed;color:white;text-decoration:none;padding:8px 16px;border-radius:4px;font-size:13px;margin-right:8px">&#128202; Analytics</a><span id="user-name"></span> <button id="bell-btn" onclick="toggleNotifPanel()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;position:relative;padding:0 4px;vertical-align:middle;margin-right:6px" title="Benachrichtigungen"><span id="bell-icon">🔔</span><span id="notif-count" style="display:none;position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:50%;font-size:10px;padding:1px 4px;font-weight:700"></span></button><button onclick="logout()">Logout</button></div>
  </nav>

  <div style="display:flex;gap:8px;margin-bottom:16px;border-bottom:2px solid #e5e7eb;padding-bottom:8px">
    <button id="tab-listings" onclick="showTab('listings')" style="background:#dc2626;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px">Listings pending</button>
    <button id="tab-verify" onclick="showTab('verify')" style="background:#e5e7eb;color:#374151;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px">Verification queue</button>
  </div>
  <!-- K-60: Search & filter panel -->
  <div class="search-filter-bar" id="search-filter-bar">
    <input type="text" id="admin-search" placeholder="Suche nach Titel, Stadt…" oninput="debounceSearch()">
    <select id="filter-status" onchange="applyFilters()">
      <option value="pending">Ausstehend</option>
      <option value="active">Aktiv</option>
      <option value="rejected">Abgelehnt</option>
      <option value="expired">Abgelaufen</option>
      <option value="draft">Entwurf</option>
      <option value="all">Alle Status</option>
    </select>
    <select id="filter-type" onchange="applyFilters()">
      <option value="">Alle Typen</option>
      <option value="equipment">Equipment</option>
      <option value="service">Service</option>
    </select>
    <button class="reset-btn" onclick="resetFilters()">Zurücksetzen</button>
  </div>
  <div id="summary">Lade ausstehende Inserate...</div>
  <div id="listings"></div>
  <div id="verify-section" style="display:none">
    <div id="verify-summary"></div>
    <div id="verify-list"></div>
  </div>

  <script src="api-client.js"></script>
  <script>
    redirectIfNotLoggedIn();
    const user = auth.getUser();
    if (user?.role !== 'admin') {
      document.body.innerHTML = '<p style="color:red;padding:40px">Kein Zugriff. Nur Admins.</p>';
    }
    document.getElementById('user-name').textContent = user?.name || user?.email || '';


    // K-53: Notification center
    let notifPanelOpen = false;
    async function loadNotifications() {
      if (!auth.getToken()) return;
      try {
        const data = await NotificationsAPI.getAll();
        const count = data.unread || 0;
        const badge = document.getElementById('notif-count');
        if (badge) { badge.textContent = count > 9 ? '9+' : String(count); badge.style.display = count > 0 ? 'block' : 'none'; }
        if (notifPanelOpen) renderNotifList(data.notifications || []);
      } catch(e) {}
    }
    function renderNotifList(notifications) {
      const el = document.getElementById('notif-list');
      if (!el) return;
      if (!notifications.length) { el.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:24px;font-size:14px">Keine Benachrichtigungen</p>'; return; }
      el.innerHTML = notifications.map(n =>
        '<div style="padding:12px 16px;border-bottom:1px solid #f9fafb;background:' + (n.read_at ? '#fff' : '#f0f4ff') + ';cursor:pointer" onclick="readNotif(' + n.id + ', this)">' +
        '<div style="font-size:13px;font-weight:600;color:#1f2937">' + (n.subject||'') + '</div>' +
        '<div style="font-size:12px;color:#6b7280;margin-top:2px">' + (n.body||'').slice(0,80) + ((n.body||'').length>80?'…':'') + '</div>' +
        '<div style="font-size:11px;color:#9ca3af;margin-top:4px">' + new Date(n.created_at).toLocaleDateString('de-DE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) + '</div>' +
        '</div>'
      ).join('');
    }
    function toggleNotifPanel() {
      const panel = document.getElementById('notif-panel');
      if (notifPanelOpen) { panel.style.display = 'none'; notifPanelOpen = false; }
      else {
        panel.style.display = 'flex'; notifPanelOpen = true;
        NotificationsAPI.getAll().then(d => { renderNotifList(d.notifications||[]); const b=document.getElementById('notif-count'); if(b) b.style.display='none'; }).catch(()=>{});
      }
    }
    function closeNotifPanel() { document.getElementById('notif-panel').style.display = 'none'; notifPanelOpen = false; }
    async function readNotif(id, el) { el.style.background = '#fff'; try { await NotificationsAPI.markRead(id); } catch(e) {} }
    async function markAllRead() {
      try { await NotificationsAPI.markAllRead(); document.querySelectorAll('#notif-list > div').forEach(el => el.style.background='#fff'); const b=document.getElementById('notif-count'); if(b) b.style.display='none'; } catch(e) {}
    }

    function logout() { AuthAPI.logout(); location.href = 'auth.html'; }

    function renderListing(l) {
      return `<div class="card" id="card-${l.id}">
        <div class="listing-header" style="display:flex;align-items:flex-start;gap:10px">
          <input type="checkbox" class="bulk-cb" value="${l.id}" onclick="updateBulkBar()" style="margin-top:4px;width:16px;height:16px;cursor:pointer">
          <div style="flex:1">
          <h3 style="margin:0">${l.title}</h3>
          <span style="font-size:12px;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:12px">${l.status}</span>
        </div>
        <div class="meta">
          Typ: <strong>${l.type}</strong> · Geo: <strong>${l.geo}</strong>
          ${l.city ? '· Stadt: <strong>' + l.city + '</strong>' : ''}
          · Provider ID: ${l.provider_id}
        </div>
        <div>${(l.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="actions">
          <button class="btn-approve" onclick="approve(${l.id})">✓ Genehmigen</button>
          <input class="reason" type="text" id="reason-${l.id}" placeholder="Ablehnungsgrund (optional)">
          <button class="btn-reject" onclick="reject(${l.id})">✗ Ablehnen</button>
          <button class="btn-feature ${l.is_featured ? '' : 'unfeatured'}" onclick="toggleFeature(${l.id}, ${l.is_featured ? 1 : 0})">${l.is_featured ? '\u2B50 Unfeature' : '\u2606 Feature'}</button>
        </div>
        </div>
        <div id="msg-${l.id}"></div>
      </div>`;
    }

    async function approve(id) {
      try {
        await AdminAPI.approve(id);
        const msg = document.getElementById('msg-' + id);
        msg.innerHTML = '<div class="status-ok">✓ Genehmigt</div>';
        document.querySelector('#card-' + id + ' .btn-approve').disabled = true;
        document.querySelector('#card-' + id + ' .btn-reject').disabled = true;
        loadPending();
      } catch(ex) {
        document.getElementById('msg-' + id).innerHTML = '<div class="status-err">Fehler: ' + ex.message + '</div>';
      }
    }

    async function reject(id) {
      const reason = document.getElementById('reason-' + id)?.value || '';
      try {
        await AdminAPI.reject(id, reason);
        const msg = document.getElementById('msg-' + id);
        msg.innerHTML = '<div class="status-err">✗ Abgelehnt</div>';
        document.querySelector('#card-' + id + ' .btn-approve').disabled = true;
        document.querySelector('#card-' + id + ' .btn-reject').disabled = true;
        loadPending();
      } catch(ex) {
        document.getElementById('msg-' + id).innerHTML = '<div class="status-err">Fehler: ' + ex.message + '</div>';
      }
    }

    async function toggleFeature(id, isFeatured) {
      try {
        if (isFeatured) await AdminAPI.unfeature(id);
        else await AdminAPI.feature(id);
        loadPending();
      } catch(ex) { alert('Error: ' + ex.message); }
    }

    function showTab(tab) {
      document.getElementById('listings').style.display = tab === 'listings' ? '' : 'none';
      document.getElementById('summary').style.display = tab === 'listings' ? '' : 'none';
      document.getElementById('search-filter-bar').style.display = tab === 'listings' ? 'flex' : 'none';
      document.getElementById('verify-section').style.display = tab === 'verify' ? '' : 'none';
      document.getElementById('tab-listings').style.cssText = tab === 'listings'
        ? 'background:#dc2626;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px'
        : 'background:#e5e7eb;color:#374151;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px';
      document.getElementById('tab-verify').style.cssText = tab === 'verify'
        ? 'background:#7c3aed;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px'
        : 'background:#e5e7eb;color:#374151;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px';
      if (tab === 'verify') loadVerificationQueue();
    }

    // K-37: Verification queue
    async function loadVerificationQueue() {
      const sum = document.getElementById('verify-summary');
      const list = document.getElementById('verify-list');
      sum.textContent = 'Loading...';
      try {
        const data = await api('GET', '/admin/providers/pending-verification', null, auth.getToken());
        const providers = data.providers || [];
        sum.textContent = providers.length + ' provider(s) awaiting verification';
        if (!providers.length) {
          list.innerHTML = '<div class="empty">No pending verifications ✓</div>';
          return;
        }
        list.innerHTML = providers.map(p => `
          <div class="card" id="vcard-${p.user_id}">
            <h3 style="margin:0 0 4px">${p.company_name || p.name || 'Unknown'}</h3>
            <div class="meta">Email: <strong>${p.email}</strong> · Requested: ${p.verification_requested_at ? new Date(p.verification_requested_at).toLocaleDateString() : '—'}</div>
            <div class="actions" style="margin-top:10px">
              <button onclick="verifyProvider(${p.user_id}, true)" style="background:#059669;color:white;border:none;padding:7px 16px;border-radius:4px;cursor:pointer;margin-right:8px">✓ Approve</button>
              <button onclick="verifyProvider(${p.user_id}, false)" style="background:#dc2626;color:white;border:none;padding:7px 16px;border-radius:4px;cursor:pointer">✗ Reject</button>
            </div>
          </div>`).join('');
      } catch(e) {
        sum.textContent = 'Error: ' + e.message;
      }
    }

    async function verifyProvider(userId, approve) {
      try {
        await api('PATCH', '/admin/providers/' + userId + '/verify', { approve }, auth.getToken());
        const card = document.getElementById('vcard-' + userId);
        if (card) {
          card.style.opacity = '0.5';
          card.querySelector('.actions').innerHTML = approve
            ? '<span style="color:#059669;font-weight:600">✓ Approved</span>'
            : '<span style="color:#dc2626;font-weight:600">✗ Rejected</span>';
        }
      } catch(e) { alert('Error: ' + e.message); }
    }


    function updateBulkBar() {
      const checked = document.querySelectorAll('.bulk-cb:checked');
      const bar = document.getElementById('bulk-bar');
      const countEl = document.getElementById('bulk-count');
      if (checked.length > 0) {
        bar.style.display = 'flex';
        countEl.textContent = checked.length + ' ausgewählt';
      } else {
        bar.style.display = 'none';
      }
    }

    function clearSelection() {
      document.querySelectorAll('.bulk-cb:checked').forEach(cb => { cb.checked = false; });
      document.getElementById('bulk-bar').style.display = 'none';
    }

    async function bulkApprove() {
      const ids = Array.from(document.querySelectorAll('.bulk-cb:checked')).map(cb => parseInt(cb.value));
      if (!ids.length) return;
      if (!confirm('Wirklich ' + ids.length + ' Inserate genehmigen?')) return;
      try {
        const r = await AdminAPI.bulkAction(ids, 'approve');
        alert(r.message);
        clearSelection();
        loadPending();
      } catch(e) { alert('Fehler: ' + e.message); }
    }

    async function bulkReject() {
      const ids = Array.from(document.querySelectorAll('.bulk-cb:checked')).map(cb => parseInt(cb.value));
      if (!ids.length) return;
      const reason = prompt('Ablehnungsgrund (optional):') || '';
      if (reason === null) return; // cancelled
      try {
        const r = await AdminAPI.bulkAction(ids, 'reject', reason);
        alert(r.message);
        clearSelection();
        loadPending();
      } catch(e) { alert('Fehler: ' + e.message); }
    }

    // K-60: Search/filter
    let searchTimer = null;
    function debounceSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(applyFilters, 300);
    }

    async function applyFilters() {
      const status = document.getElementById('filter-status').value;
      const type = document.getElementById('filter-type').value;
      const search = document.getElementById('admin-search').value.trim();
      await loadListings({ status, type: type || undefined, search: search || undefined });
    }

    function resetFilters() {
      document.getElementById('filter-status').value = 'pending';
      document.getElementById('filter-type').value = '';
      document.getElementById('admin-search').value = '';
      loadListings({ status: 'pending' });
    }

    async function loadListings(filters = { status: 'pending' }) {
      try {
        const data = await AdminAPI.getListings(filters);
        const listings = data.listings || data;
        const el = document.getElementById('listings');
        const statusLabel = filters.status === 'all' ? 'alle' : filters.status || 'ausstehende';
        document.getElementById('summary').textContent = listings.length + ' ' + statusLabel + ' Inserate';
        if (!listings.length) {
          el.innerHTML = '<div class="empty">Keine Inserate gefunden 🎉</div>';
        } else {
          el.innerHTML = listings.map(renderListing).join('');
        }
      } catch(ex) {
        document.getElementById('summary').textContent = 'Fehler beim Laden: ' + ex.message;
      }
    }

    async function loadPending() {
      await loadListings({ status: 'pending' });
    }

    loadPending();
  </script>

  <!-- K-53: Notification panel -->
  <div id="notif-panel" style="display:none;position:fixed;top:52px;right:16px;width:340px;max-width:95vw;max-height:480px;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.16);z-index:999;overflow:hidden;flex-direction:column">
    <div style="padding:14px 16px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between">
      <strong style="font-size:15px">Benachrichtigungen</strong>
      <div style="display:flex;gap:8px;align-items:center">
        <button onclick="markAllRead()" style="font-size:12px;color:#4f46e5;background:none;border:none;cursor:pointer;padding:0">Alle gelesen</button>
        <button onclick="closeNotifPanel()" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:16px">✕</button>
      </div>
    </div>
    <div id="notif-list" style="overflow-y:auto;max-height:400px;padding:0"></div>
  </div>
</body>
</html>
