<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Startup Radar — Provider Dashboard</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 0 auto; padding: 20px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 2px solid #4f46e5; margin-bottom: 24px; }
    nav h1 { margin: 0; color: #4f46e5; }
    nav button { background: none; border: 1px solid #ddd; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .panel { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 14px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
    button.primary { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
    button.primary:hover { background: #4338ca; }
    .error { color: red; margin: 6px 0; display: none; }
    .success { color: green; margin: 6px 0; display: none; }
    .listing-item { border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin: 8px 0; transition: border-color .3s; }
    .listing-item.flash { border-color: #10b981; background: #f0fdf4; }
    .listing-item.flash-reject { border-color: #ef4444; background: #fef2f2; }
    .status-badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; margin-left: 6px; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #d1fae5; color: #065f46; }
    .status-rejected { background: #fee2e2; color: #991b1b; }
    .status-draft { background: #e0e7ff; color: #3730a3; }
    .status-expired { background: #f3f4f6; color: #6b7280; }
    .btn-renew { padding: 4px 12px; background: #0ea5e9; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-renew:hover { background: #0284c7; }
    .expiry-hint { font-size: 11px; color: #9ca3af; margin-top: 4px; }
    .listing-actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-edit { padding: 4px 12px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-edit:hover { background: #e5e7eb; }
    .btn-delete { padding: 4px 12px; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .btn-delete:hover { background: #fecaca; }
    .edit-form { display: none; margin-top: 10px; padding: 10px; background: #f9fafb; border-radius: 6px; border: 1px solid #e5e7eb; }
    .edit-form input, .edit-form textarea, .edit-form select { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-bottom: 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 13px; }
    .btn-save { padding: 5px 14px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
    .toast { position: fixed; top: 20px; right: 20px; padding: 14px 20px; border-radius: 8px; color: white; font-weight: 600; z-index: 9999; display: none; animation: fadeIn .3s; }
    .toast.show { display: block; }
    .toast.approved { background: #10b981; }
    .toast.rejected { background: #ef4444; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .sse-status { font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
    .profile-section { margin-top: 24px; }
    .profile-section .card { padding: 24px; }
    .form-msg { font-size: 13px; margin: 6px 0; display: none; }
    .form-msg.success { color: #059669; }
    .form-msg.error { color: #dc2626; }
    .sse-status.live { color: #10b981; }
    /* K-76: Expiry warning banner */
    .expiry-banner { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; }
    .expiry-banner .icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .expiry-banner ul { margin: 4px 0 0; padding-left: 18px; font-size: 13px; color: #78350f; }
    .expiry-banner ul li { margin: 2px 0; }
    .expiry-banner a { color: #b45309; font-weight: 600; text-decoration: underline; cursor: pointer; }

    /* K-23: Mobile responsive */
    @media (max-width: 640px) {
      body { padding: 12px; }
      nav { flex-direction: column; align-items: flex-start; gap: 8px; }
      nav div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      nav h1 { font-size: 16px; }
      .filters, .search-bar { flex-direction: column; }
      .filters select, .filters input { width: 100%; box-sizing: border-box; }
      .search-bar input, .search-bar button { width: 100%; box-sizing: border-box; }
      .card { padding: 14px; }
      .score-badge { position: static; display: inline-block; margin-top: 8px; }
      .contact-btn, .action-btn, button[type=submit] { width: 100%; padding: 12px; font-size: 15px; box-sizing: border-box; }
      input[type=text], input[type=email], input[type=password], textarea, select { width: 100%; box-sizing: border-box; }
      .grid, .kpi-grid { grid-template-columns: 1fr !important; }
      table { font-size: 12px; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <nav>
    <h1>&#x1F680; Startup Radar</h1>
    <div><button id="bell-btn" onclick="toggleNotifPanel()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;position:relative;padding:0 4px;vertical-align:middle;margin-right:6px" title="Benachrichtigungen"><span id="bell-icon">🔔</span><span id="notif-count" style="display:none;position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:50%;font-size:10px;padding:1px 4px;font-weight:700"></span></button><a href="messages.html" id="msg-badge" style="background:#4f46e5;color:white;text-decoration:none;padding:8px 14px;border-radius:4px;font-size:13px;margin-right:8px">&#x1F4AC; Messages</a><span id="user-name"></span> <button onclick="logout()">Logout</button></div>
  </nav>

  <!-- K-76: Expiry warning banner -->
  <div id="expiry-banner" style="display:none"></div>

  <div class="panel">
    <div>
      <div class="card">
        <h2>Inserat erstellen</h2>
        <form id="listing-form">
          <label>Titel</label>
          <input type="text" id="l-title" placeholder="z.B. 3D-Drucker verf&#xFC;gbar" required>
          <label>Typ</label>
          <select id="l-type">
            <option value="equipment">Equipment</option>
            <option value="space">Workspace / Space</option>
            <option value="service">Service</option>
          </select>
          <label>Region</label>
          <select id="l-geo">
            <option value="local">Lokal (&lt;50km)</option>
            <option value="regional">Regional (&lt;200km)</option>
            <option value="national">National</option>
          </select>
          <label>Stadt</label>
          <input type="text" id="l-city" placeholder="Berlin">
          <label>Tags (kommagetrennt)</label>
          <input type="text" id="l-tags" placeholder="3d-druck, prototyping">
          <label>Bild-URL <span style="font-weight:400;color:#9ca3af;font-size:12px">(optional)</span></label>
          <input type="url" id="l-image" placeholder="https://beispiel.de/bild.jpg">
          <label>Beschreibung</label>
          <textarea id="l-desc" rows="3" placeholder="Kurze Beschreibung..."></textarea>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px">
            <div>
              <label style="font-size:12px;color:#6b7280">Stundenpreis (€)</label>
              <input type="number" id="l-hourly" placeholder="z.B. 25" min="0" step="1" style="margin:2px 0">
            </div>
            <div>
              <label style="font-size:12px;color:#6b7280">Tagespreis (€)</label>
              <input type="number" id="l-daily" placeholder="z.B. 150" min="0" step="1" style="margin:2px 0">
            </div>
            <div>
              <label style="font-size:12px;color:#6b7280">Ab-Preis (€)</label>
              <input type="number" id="l-from-price" placeholder="z.B. 99" min="0" step="1" style="margin:2px 0">
            </div>
          </div>
          <div class="error" id="l-error"></div>
          <div class="success" id="l-success"></div>
          <button type="submit" class="primary" id="submit-btn">Inserat einreichen</button>
          <button type="button" class="secondary" id="draft-btn" onclick="saveDraft()" style="margin-top:8px;width:100%;padding:8px;border:1px solid #6366f1;background:#f0f0ff;color:#4338ca;border-radius:4px;cursor:pointer;font-size:14px">Als Entwurf speichern</button>
        </form>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>Meine Inserate</h2>
        <div class="sse-status" id="sse-status">&#x25CB; Connecting for live updates...</div>
        <div id="my-listings"><em>Lade...</em></div>
      </div>
    </div>
  </div>

  <!-- K-92: Message inbox summary widget -->
  <div class="profile-section" id="msg-summary-section" style="display:none">
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px">
      <div style="display:flex;align-items:center;gap:14px">
        <span style="font-size:28px">&#x1F4AC;</span>
        <div>
          <div id="msg-summary-text" style="font-size:16px;font-weight:700;color:#1e293b"></div>
          <div style="font-size:12px;color:#6b7280;margin-top:2px">Nachrichten von Foundern</div>
        </div>
      </div>
      <a href="messages.html" style="background:#4f46e5;color:#fff;text-decoration:none;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap">Posteingang &#x2192;</a>
    </div>
  </div>

  <!-- K-40: Analytics -->
  <div class="profile-section">
    <div class="card">
      <h2>&#128202; Listing Analytics</h2>
      <div id="analytics-totals" style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;font-size:14px"></div>
      <div id="analytics-chart"></div>
    </div>
  </div>

  <div class="profile-section">
    <div class="card">
      <h2>&#x1F464; Mein Profil</h2>
      <div id="verify-status"></div>
      <form id="profile-form">
        <label>Firmenname</label>
        <input type="text" id="p-company" placeholder="z.B. TechEquip GmbH">
        <label>Beschreibung</label>
        <textarea id="p-desc" rows="3" placeholder="Kurze Beschreibung eures Angebots..." maxlength="500"></textarea>
        <label>Website</label>
        <input type="url" id="p-website" placeholder="https://...">
        <label>Kontakt-E-Mail</label>
        <input type="email" id="p-email" placeholder="info@example.com">
        <!-- K-97: Social links -->
        <label style="margin-top:12px;display:block;font-weight:600;font-size:13px;color:#374151">Social Links <span style="font-weight:400;color:#9ca3af">(optional)</span></label>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:16px;width:20px;text-align:center" title="LinkedIn">in</span>
          <input type="url" id="p-linkedin" placeholder="https://linkedin.com/company/..." style="flex:1">
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:16px;width:20px;text-align:center" title="Twitter/X">𝕏</span>
          <input type="url" id="p-twitter" placeholder="https://twitter.com/..." style="flex:1">
        </div>
        <div class="form-msg" id="p-msg"></div>
        <button type="submit" class="primary" style="margin-top:4px">Profil speichern</button>
      </form>

      <!-- K-80: Change password -->
      <div style="margin-top:20px;border-top:1px solid #e5e7eb;padding-top:16px">
        <button onclick="togglePwForm()" style="background:none;border:none;color:#4f46e5;font-size:13px;cursor:pointer;padding:0;font-weight:600">&#x1F512; Passwort ändern</button>
        <div id="pw-form" style="display:none;margin-top:12px">
          <input type="password" id="pw-current" placeholder="Aktuelles Passwort" autocomplete="current-password">
          <input type="password" id="pw-new" placeholder="Neues Passwort (mind. 8 Zeichen)" autocomplete="new-password">
          <input type="password" id="pw-confirm" placeholder="Neues Passwort bestätigen" autocomplete="new-password">
          <div class="form-msg" id="pw-msg"></div>
          <button type="button" onclick="submitPwChange()" style="background:#4f46e5;color:#fff;border:none;padding:8px 18px;border-radius:4px;cursor:pointer;font-size:13px">Passwort ändern</button>
          <button type="button" onclick="togglePwForm()" style="background:#f3f4f6;color:#374151;border:none;padding:8px 14px;border-radius:4px;cursor:pointer;font-size:13px;margin-left:8px">Abbrechen</button>
        </div>
      </div>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script>
    redirectIfNotLoggedIn();
    const user = auth.getUser();
    document.getElementById('user-name').textContent = user?.name || user?.email || '';


    // K-53: Notification center
    let notifPanelOpen = false;
    async function loadNotifications() {
      if (!auth.getToken()) return;
      try {
        const data = await NotificationsAPI.getAll();
        const count = data.unread || 0;
        const badge = document.getElementById('notif-count');
        if (badge) { badge.textContent = count > 9 ? '9+' : String(count); badge.style.display = count > 0 ? 'block' : 'none'; }
        if (notifPanelOpen) renderNotifList(data.notifications || []);
      } catch(e) {}
    }
    function renderNotifList(notifications) {
      const el = document.getElementById('notif-list');
      if (!el) return;
      if (!notifications.length) { el.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:24px;font-size:14px">Keine Benachrichtigungen</p>'; return; }
      el.innerHTML = notifications.map(n =>
        '<div style="padding:12px 16px;border-bottom:1px solid #f9fafb;background:' + (n.read_at ? '#fff' : '#f0f4ff') + ';cursor:pointer" onclick="readNotif(' + n.id + ', this)">' +
        '<div style="font-size:13px;font-weight:600;color:#1f2937">' + (n.subject||'') + '</div>' +
        '<div style="font-size:12px;color:#6b7280;margin-top:2px">' + (n.body||'').slice(0,80) + ((n.body||'').length>80?'…':'') + '</div>' +
        '<div style="font-size:11px;color:#9ca3af;margin-top:4px">' + new Date(n.created_at).toLocaleDateString('de-DE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) + '</div>' +
        '</div>'
      ).join('');
    }
    function toggleNotifPanel() {
      const panel = document.getElementById('notif-panel');
      if (notifPanelOpen) { panel.style.display = 'none'; notifPanelOpen = false; }
      else {
        panel.style.display = 'flex'; notifPanelOpen = true;
        NotificationsAPI.getAll().then(d => { renderNotifList(d.notifications||[]); const b=document.getElementById('notif-count'); if(b) b.style.display='none'; }).catch(()=>{});
      }
    }
    function closeNotifPanel() { document.getElementById('notif-panel').style.display = 'none'; notifPanelOpen = false; }
    async function readNotif(id, el) { el.style.background = '#fff'; try { await NotificationsAPI.markRead(id); } catch(e) {} }
    async function markAllRead() {
      try { await NotificationsAPI.markAllRead(); document.querySelectorAll('#notif-list > div').forEach(el => el.style.background='#fff'); const b=document.getElementById('notif-count'); if(b) b.style.display='none'; } catch(e) {}
    }

    function logout() { AuthAPI.logout(); location.href = 'auth.html'; }

    function showToast(message, type) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.className = 'toast show ' + type;
      setTimeout(() => { el.className = 'toast'; }, 5000);
    }

    function flashCard(listingId, type) {
      const el = document.getElementById('listing-' + listingId);
      if (!el) return;
      el.classList.add(type === 'approved' ? 'flash' : 'flash-reject');
      setTimeout(() => el.classList.remove('flash', 'flash-reject'), 3000);
    }

    function updateCardStatus(listingId, status, reason) {
      const el = document.getElementById('listing-' + listingId);
      if (!el) return;
      const badge = el.querySelector('.status-badge');
      if (badge) {
        badge.className = 'status-badge status-' + status;
        badge.textContent = status;
      }
      if (reason) {
        let reasonEl = el.querySelector('.reject-reason');
        if (!reasonEl) {
          reasonEl = document.createElement('p');
          reasonEl.className = 'reject-reason';
          reasonEl.style.cssText = 'color:#dc2626;font-size:12px;margin:4px 0';
          el.appendChild(reasonEl);
        }
        reasonEl.textContent = 'Grund: ' + reason;
      }
    }

    // SSE — real-time listing status updates
    function connectSSE() {
      const token = auth.getToken ? auth.getToken() : localStorage.getItem('token');
      if (!token) return;

      // Use fetch-based approach since EventSource doesn't support headers
      // Instead, pass token as query param (safe for SSE)
      const url = '/api/listings/events?token=' + encodeURIComponent(token);
      const es = new EventSource(url);

      es.addEventListener('connected', () => {
        document.getElementById('sse-status').textContent = '&#x25CF; Live updates active';
        document.getElementById('sse-status').className = 'sse-status live';
      });

      es.addEventListener('listing_approved', (e) => {
        const data = JSON.parse(e.data);
        showToast('&#x2713; "' + data.title + '" wurde genehmigt!', 'approved');
        flashCard(data.listingId, 'approved');
        updateCardStatus(data.listingId, 'approved');
      });

      es.addEventListener('listing_rejected', (e) => {
        const data = JSON.parse(e.data);
        showToast('&#x2717; "' + data.title + '" wurde abgelehnt.', 'rejected');
        flashCard(data.listingId, 'rejected');
        updateCardStatus(data.listingId, 'rejected', data.reason);
      });

      es.onerror = () => {
        document.getElementById('sse-status').textContent = '&#x25CB; Reconnecting...';
        document.getElementById('sse-status').className = 'sse-status';
        es.close();
        setTimeout(connectSSE, 5000);
      };
    }

    async function loadMyListings() {
      try {
        const data = await ListingsAPI.getMine();
        const el = document.getElementById('my-listings');
        if (!data.listings?.length) { el.innerHTML = '<em>Noch keine Inserate.</em>'; return; }
        el.innerHTML = data.listings.map(l => `
          <div class="listing-item" id="listing-${l.id}">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <strong id="title-display-${l.id}" style="cursor:pointer" title="Doppelklick zum Bearbeiten" ondblclick="quickEditTitle(${l.id}, '${(l.title||'').replace(/'/g,"&#39;")}')">${l.title}</strong>
              <button onclick="quickEditTitle(${l.id}, '${(l.title||'').replace(/'/g,"&#39;")}')" style="background:none;border:none;cursor:pointer;font-size:12px;color:#9ca3af;padding:0 2px" title="Titel bearbeiten">✏️</button>
            </div>
            <div id="title-edit-wrap-${l.id}" style="display:none;margin:4px 0;display:none">
              <input type="text" id="title-edit-${l.id}" style="padding:5px 8px;border:1px solid #4f46e5;border-radius:4px;font-size:14px;width:240px" onkeydown="if(event.key==='Enter')saveQuickTitle(${l.id});if(event.key==='Escape')cancelQuickTitle(${l.id})">
              <button onclick="saveQuickTitle(${l.id})" style="background:#4f46e5;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:4px">✓</button>
              <button onclick="cancelQuickTitle(${l.id})" style="background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:3px">✕</button>
            </div>
            <span class="status-badge status-${l.status}">${l.status}</span>
            <p style="margin:4px 0;font-size:13px">${l.type} &middot; ${l.geo} &middot; ${l.city || ''}</p>
            <div>${(l.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>
            <p style="margin:6px 0 0;font-size:12px;color:#6b7280">
              &#x1F441; ${l.view_count||0} Aufrufe &nbsp;&bull;&nbsp; &#x1F4AC; ${l.contact_count||0} Kontakte
            </p>
            ${l.expires_at ? `<p class="expiry-hint">&#x23F3; Läuft ab: ${new Date(l.expires_at).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'})}</p>` : ''}
            <div class="listing-actions">
              ${l.status === 'draft' ? `<button onclick="publishListing(${l.id})" style="padding:4px 12px;background:#4f46e5;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px">&#x1F4E4; Veröffentlichen</button>` : ''}
              ${l.status === 'expired' ? `<button class="btn-renew" onclick="renewListing(${l.id})">&#x1F504; Erneuern (+90 Tage)</button>` : ''}
              ${l.status === 'active' ? `<button onclick="pauseListing(${l.id})" style="padding:4px 12px;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:4px;cursor:pointer;font-size:12px" title="Inserat pausieren (→ Entwurf)">⏸ Pausieren</button>` : ''}
              <button class="btn-edit" onclick="toggleEdit(${l.id})">&#x270E; Bearbeiten</button>
              <button onclick="duplicateListing(${l.id})" style="padding:4px 12px;background:#f9fafb;color:#374151;border:1px solid #d1d5db;border-radius:4px;cursor:pointer;font-size:12px" title="Als Entwurf kopieren">&#x2398; Duplizieren</button>
              <button class="btn-delete" onclick="deleteListing(${l.id}, '${(l.title||'').replace(/'/g,'')}')">&#x1F5D1; Löschen</button>
            </div>
            <div class="edit-form" id="edit-form-${l.id}">
              <input type="text" id="edit-title-${l.id}" value="${(l.title||'').replace(/"/g,'&quot;')}" placeholder="Titel">
              <select id="edit-geo-${l.id}">
                ${['local','regional','national','remote','global'].map(g => `<option value="${g}" ${l.geo===g?'selected':''}>${g}</option>`).join('')}
              </select>
              <input type="text" id="edit-city-${l.id}" value="${l.city||''}" placeholder="Stadt">
              <input type="text" id="edit-tags-${l.id}" value="${(l.tags||[]).join(', ')}" placeholder="Tags">
              <textarea id="edit-desc-${l.id}" rows="2" placeholder="Beschreibung">${l.description||''}</textarea>
              <button class="btn-save" onclick="saveEdit(${l.id})">Speichern</button>
              <button class="btn-edit" onclick="toggleEdit(${l.id})" style="margin-left:6px">Abbrechen</button>
            </div>
          </div>
        `).join('');
        // K-76: Show expiry warning banner for listings expiring within 7 days
        const now = Date.now();
        const sevenDays = 7 * 24 * 60 * 60 * 1000;
        const expiringSoon = data.listings.filter(l => {
          if (!l.expires_at || l.status === 'expired') return false;
          const exp = new Date(l.expires_at).getTime();
          return exp > now && exp - now <= sevenDays;
        });
        const banner = document.getElementById('expiry-banner');
        if (expiringSoon.length) {
          banner.style.display = 'flex';
          banner.className = 'expiry-banner';
          banner.innerHTML = `
            <div class="icon">⚠️</div>
            <div>
              <strong style="color:#92400e;font-size:14px">Ablauf in den nächsten 7 Tagen</strong>
              <ul>${expiringSoon.map(l => {
                const daysLeft = Math.ceil((new Date(l.expires_at) - now) / (24 * 60 * 60 * 1000));
                return `<li><strong>${l.title}</strong> — läuft in <strong>${daysLeft} Tag${daysLeft !== 1 ? 'en' : ''}</strong> ab
                  <a onclick="renewListing(${l.id})" style="margin-left:8px">Jetzt erneuern →</a></li>`;
              }).join('')}</ul>
            </div>`;
        } else {
          banner.style.display = 'none';
        }
      } catch(ex) {
        document.getElementById('my-listings').innerHTML = '<em>Fehler: ' + ex.message + '</em>';
      }
    }

    async function saveDraft() {
      const err = document.getElementById('l-error');
      const ok = document.getElementById('l-success');
      err.style.display = 'none'; ok.style.display = 'none';
      const tags = document.getElementById('l-tags').value.split(',').map(t => t.trim()).filter(Boolean);
      const title = document.getElementById('l-title').value.trim();
      if (!title) { err.textContent = 'Titel erforderlich.'; err.style.display = 'block'; return; }
      try {
        const res = await fetch('/api/listings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
          body: JSON.stringify({
            title,
            type: document.getElementById('l-type').value,
            geo: document.getElementById('l-geo').value,
            city: document.getElementById('l-city').value,
            tags,
            description: document.getElementById('l-desc').value,
            hourlyRate: parseFloat(document.getElementById('l-hourly').value) || null,
            dailyRate: parseFloat(document.getElementById('l-daily').value) || null,
            fromPrice: parseFloat(document.getElementById('l-from-price').value) || null,
            imageUrl: document.getElementById('l-image').value.trim() || null,
            draft: true
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Fehler');
        ok.textContent = 'Entwurf gespeichert!';
        ok.style.display = 'block';
        document.getElementById('listing-form').reset();
        setTimeout(() => loadMyListings(), 800);
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
      }
    }

    function toggleEdit(id) {
      const form = document.getElementById('edit-form-' + id);
      form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    async function saveEdit(id) {
      const title = document.getElementById('edit-title-' + id).value.trim();
      const geo = document.getElementById('edit-geo-' + id).value;
      const city = document.getElementById('edit-city-' + id).value.trim();
      const tags = document.getElementById('edit-tags-' + id).value.split(',').map(t => t.trim()).filter(Boolean);
      const description = document.getElementById('edit-desc-' + id).value.trim();
      if (!title) { alert('Titel darf nicht leer sein.'); return; }
      try {
        const res = await fetch('/api/listings/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
          body: JSON.stringify({ title, geo, city, tags, description })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Fehler');
        toggleEdit(id);
        loadMyListings();
      } catch (ex) {
        alert('Fehler: ' + ex.message);
      }
    }

    async function deleteListing(id, title) {
      if (!confirm('Inserat "' + title + '" wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) return;
      try {
        const res = await fetch('/api/listings/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Fehler');
        // Remove card from DOM immediately
        const card = document.getElementById('listing-' + id);
        if (card) card.remove();
      } catch (ex) {
        alert('Fehler: ' + ex.message);
      }
    }

    async function publishListing(id) {
      if (!confirm('Inserat zur Prüfung einreichen?')) return;
      try {
        const res = await fetch('/api/listings/' + id + '/publish', {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Fehler');
        alert('Inserat eingereicht! Wird nach Prüfung freigeschaltet.');
        loadMyListings();
      } catch (ex) {
        alert('Fehler: ' + ex.message);
      }
    }

    // K-73: Duplicate listing as draft
    async function duplicateListing(id) {
      try {
        const r = await ListingsAPI.duplicate(id);
        showToast('Entwurf erstellt: "' + (r.listing?.title || 'Kopie') + '"', 'success');
        loadMyListings();
      } catch (ex) {
        alert('Fehler: ' + ex.message);
      }
    }

    // K-103: Inline title quick-edit
    function quickEditTitle(id, currentTitle) {
      document.getElementById('title-display-' + id).style.display = 'none';
      const wrap = document.getElementById('title-edit-wrap-' + id);
      wrap.style.display = 'block';
      const inp = document.getElementById('title-edit-' + id);
      inp.value = currentTitle;
      inp.focus();
      inp.select();
    }

    function cancelQuickTitle(id) {
      document.getElementById('title-edit-wrap-' + id).style.display = 'none';
      document.getElementById('title-display-' + id).style.display = '';
    }

    async function saveQuickTitle(id) {
      const inp = document.getElementById('title-edit-' + id);
      const newTitle = inp.value.trim();
      if (!newTitle) { inp.style.border = '1px solid #ef4444'; return; }
      try {
        const res = await fetch('/api/listings/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + auth.getToken() },
          body: JSON.stringify({ title: newTitle })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Fehler');
        document.getElementById('title-display-' + id).textContent = newTitle;
        cancelQuickTitle(id);
      } catch(ex) {
        inp.style.border = '1px solid #ef4444';
        showToast('Fehler: ' + ex.message, 'error');
      }
    }

    // K-103: Pause active listing → draft
    async function pauseListing(id) {
      try {
        await ListingsAPI.pause(id);
        showToast('Inserat pausiert (Entwurf)', 'success');
        loadMyListings();
      } catch(ex) {
        showToast('Fehler: ' + ex.message, 'error');
      }
    }

    // K-56: Renew expired listing
    async function renewListing(id) {
      if (!confirm('Inserat für weitere 90 Tage erneuern?')) return;
      try {
        const r = await ListingsAPI.renew(id);
        alert(r.message || 'Inserat erneuert — läuft jetzt wieder 90 Tage.');
        loadMyListings();
      } catch (ex) {
        alert('Fehler: ' + ex.message);
      }
    }

    document.getElementById('listing-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('l-error');
      const ok = document.getElementById('l-success');
      err.style.display = 'none'; ok.style.display = 'none';
      const tags = document.getElementById('l-tags').value.split(',').map(t => t.trim()).filter(Boolean);
      try {
        const hourlyRate = parseFloat(document.getElementById('l-hourly').value) || null;
        const dailyRate = parseFloat(document.getElementById('l-daily').value) || null;
        const fromPrice = parseFloat(document.getElementById('l-from-price').value) || null;
        await ListingsAPI.create({
          title: document.getElementById('l-title').value,
          type: document.getElementById('l-type').value,
          geo: document.getElementById('l-geo').value,
          city: document.getElementById('l-city').value,
          tags,
          description: document.getElementById('l-desc').value,
          hourlyRate,
          dailyRate,
          fromPrice,
          imageUrl: document.getElementById('l-image').value.trim() || null,
        });
        ok.style.display = 'block';
        ok.textContent = 'Inserat eingereicht! Wird nach Pr&#xFC;fung freigeschaltet.';
        e.target.reset();
        // Load saved provider profile
    async function loadProviderProfile() {
      try {
        const data = await api('GET', '/providers/profile', null, auth.getToken());
        const p = data.profile;
        if (p) {
          document.getElementById('p-company').value = p.company_name || '';
          document.getElementById('p-desc').value = p.description || '';
          document.getElementById('p-website').value = p.website || '';
          document.getElementById('p-email').value = p.contact_email || '';
          // K-97: Social links
          const sl = p.social_links || {};
          document.getElementById('p-linkedin').value = sl.linkedin || '';
          document.getElementById('p-twitter').value = sl.twitter || '';
          const verifyEl = document.getElementById('verify-status');
          if (verifyEl) {
            if (p.is_verified) {
              verifyEl.textContent = '✓ Verified Provider';
              verifyEl.style.cssText = 'color:#065f46;background:#d1fae5;padding:6px 12px;border-radius:6px;font-size:13px;display:inline-block;margin-top:8px;';
            } else if (p.verification_status === 'pending') {
              verifyEl.textContent = 'Verification pending review';
              verifyEl.style.cssText = 'color:#92400e;background:#fef3c7;padding:6px 12px;border-radius:6px;font-size:13px;display:inline-block;margin-top:8px;';
            } else {
              const btn = document.createElement('button');
              btn.textContent = 'Request Verified Badge';
              btn.onclick = requestVerification;
              btn.style.cssText = 'background:#4f46e5;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;margin-top:8px;';
              verifyEl.appendChild(btn);
            }
          }
        }
      } catch(e) { /* profile may not exist yet */ }
    }

    async function requestVerification() {
      try {
        await api('POST', '/providers/verify-request', {}, auth.getToken());
        const el = document.getElementById('verify-status');
        el.innerHTML = '';
        el.textContent = 'Verification pending review';
        el.style.cssText = 'color:#92400e;background:#fef3c7;padding:6px 12px;border-radius:6px;font-size:13px;display:inline-block;margin-top:8px;';
      } catch(e) { alert('Error: ' + e.message); }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('p-msg');
      msg.style.display = 'none';
      try {
        const linkedin = document.getElementById('p-linkedin').value.trim();
        const twitter = document.getElementById('p-twitter').value.trim();
        const social_links = (linkedin || twitter) ? { linkedin: linkedin || null, twitter: twitter || null } : null;
        await api('POST', '/providers/profile', {
          company_name: document.getElementById('p-company').value,
          description: document.getElementById('p-desc').value,
          website: document.getElementById('p-website').value,
          contact_email: document.getElementById('p-email').value,
          social_links,
        }, auth.getToken());
        msg.className = 'form-msg success';
        msg.textContent = '&#x2713; Profil gespeichert';
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      } catch(ex) {
        msg.className = 'form-msg error';
        msg.textContent = 'Fehler: ' + ex.message;
        msg.style.display = 'block';
      }
    });

    // K-80: Change password
    function togglePwForm() {
      const f = document.getElementById('pw-form');
      f.style.display = f.style.display === 'block' ? 'none' : 'block';
      if (f.style.display === 'none') {
        ['pw-current','pw-new','pw-confirm'].forEach(id => { document.getElementById(id).value = ''; });
        const msg = document.getElementById('pw-msg'); msg.style.display = 'none';
      }
    }
    async function submitPwChange() {
      const msg = document.getElementById('pw-msg');
      msg.style.display = 'none';
      const cur = document.getElementById('pw-current').value;
      const nw  = document.getElementById('pw-new').value;
      const cnf = document.getElementById('pw-confirm').value;
      if (!cur || !nw || !cnf) { msg.className='form-msg error'; msg.textContent='Alle Felder ausfüllen.'; msg.style.display='block'; return; }
      if (nw.length < 8) { msg.className='form-msg error'; msg.textContent='Mindestens 8 Zeichen erforderlich.'; msg.style.display='block'; return; }
      if (nw !== cnf) { msg.className='form-msg error'; msg.textContent='Passwörter stimmen nicht überein.'; msg.style.display='block'; return; }
      try {
        await AuthAPI.changePassword(cur, nw);
        msg.className='form-msg success'; msg.textContent='✓ Passwort erfolgreich geändert.'; msg.style.display='block';
        ['pw-current','pw-new','pw-confirm'].forEach(id => { document.getElementById(id).value = ''; });
        setTimeout(() => togglePwForm(), 2000);
      } catch(ex) {
        msg.className='form-msg error'; msg.textContent='Fehler: ' + ex.message; msg.style.display='block';
      }
    }

    loadMyListings();
    loadProviderProfile();
    loadAnalytics();
      } catch(ex) {
        err.style.display = 'block';
        err.textContent = ex.message;
      }
    });

    loadMyListings();
    connectSSE();
    loadMsgSummary();

    // K-92: Message inbox summary
    async function loadMsgSummary() {
      try {
        const data = await MessagesAPI.getThreads();
        const threads = data.threads || [];
        if (!threads.length) return; // no messages — keep widget hidden
        const unread = threads.filter(t => t.unread).length;
        const section = document.getElementById('msg-summary-section');
        const text = document.getElementById('msg-summary-text');
        if (unread > 0) {
          text.innerHTML = '<span style="color:#ef4444">' + unread + ' ungelesene Nachricht' + (unread !== 1 ? 'en' : '') + '</span>';
        } else {
          text.textContent = threads.length + ' Nachrichtenthread' + (threads.length !== 1 ? 's' : '');
        }
        section.style.display = 'block';
      } catch(_) { /* non-critical */ }
    }

    async function loadAnalytics() {
      try {
        const data = await api('GET', '/providers/analytics', null, auth.getToken());
        const { listings, totals } = data;

        // Totals row
        document.getElementById('analytics-totals').innerHTML = [
          ['Listings', totals.total_listings],
          ['Total Views', totals.total_views],
          ['Contacts', totals.total_contacts],
          ['Premium Active', totals.premium_active]
        ].map(([k,v]) => `<div style="background:#f3f4f6;border-radius:8px;padding:10px 16px;text-align:center"><div style="font-size:22px;font-weight:700;color:#4f46e5">${v}</div><div style="color:#6b7280;font-size:12px">${k}</div></div>`).join('');

        // Bar chart + sparkline (CSS bars + inline SVG, no library)
        const chart = document.getElementById('analytics-chart');
        if (!listings.length) { chart.innerHTML = '<p style="color:#9ca3af;font-size:13px">No listings yet.</p>'; return; }
        const maxViews = Math.max(...listings.map(l => l.view_count || 0), 1);

        // K-96: Performance badge — Hot / Rising / Stale based on sparkline velocity
        function calcPerfBadge(spark) {
          if (!spark || spark.length < 4) return null;
          const half = Math.floor(spark.length / 2);
          const oldAvg = spark.slice(0, half).reduce((s, v) => s + v, 0) / half;
          const newAvg = spark.slice(-half).reduce((s, v) => s + v, 0) / half;
          if (newAvg === 0 && oldAvg === 0) return null; // no data
          if (newAvg > oldAvg * 1.3) return { label: '🔥 Hot', bg: '#fee2e2', color: '#991b1b' };
          if (newAvg > oldAvg * 1.05) return { label: '📈 Rising', bg: '#d1fae5', color: '#065f46' };
          return { label: '💤 Stale', bg: '#f3f4f6', color: '#6b7280' };
        }

        function renderSparkline(data) {
          const W = 64, H = 24, pad = 2;
          const max = Math.max(...data, 1);
          const xs = data.map((_, i) => pad + i * ((W - pad * 2) / (data.length - 1)));
          const ys = data.map(v => H - pad - ((v / max) * (H - pad * 2)));
          const pts = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
          const area = `${xs[0].toFixed(1)},${(H-pad)} ` + pts + ` ${xs[xs.length-1].toFixed(1)},${(H-pad)}`;
          return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">` +
            `<polygon points="${area}" fill="#ede9fe" opacity="0.7"/>` +
            `<polyline points="${pts}" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>` +
            `</svg>`;
        }

        chart.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
          '<tr style="color:#6b7280;font-size:11px;text-transform:uppercase"><th style="text-align:left;padding:4px 0">Listing</th><th style="text-align:right;padding:4px 8px">Views</th><th style="text-align:right;padding:4px 8px">Contacts</th><th style="text-align:center;padding:4px 8px">7d Trend</th><th style="text-align:center;padding:4px 8px">Perf</th><th style="width:25%"></th></tr>' +
          listings.slice(0, 10).map(l => {
            const pct = Math.round(((l.view_count || 0) / maxViews) * 100);
            const badge = l.is_premium ? ' <span style="background:#fef3c7;color:#92400e;font-size:10px;padding:1px 6px;border-radius:8px">Premium</span>' : '';
            const spark = l.sparkline && l.sparkline.length ? renderSparkline(l.sparkline) : '—';
            // K-96: Performance badge
            const perf = calcPerfBadge(l.sparkline);
            const perfHtml = perf ? `<span style="display:inline-block;background:${perf.bg};color:${perf.color};font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap">${perf.label}</span>` : '<span style="color:#d1d5db;font-size:11px">—</span>';
            return `<tr>
              <td style="padding:6px 0;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.title}${badge}</td>
              <td style="text-align:right;padding:6px 8px;font-weight:600">${l.view_count || 0}</td>
              <td style="text-align:right;padding:6px 8px;color:#059669;font-weight:600">${l.contact_count || 0}</td>
              <td style="padding:6px 8px;vertical-align:middle">${spark}</td>
              <td style="text-align:center;padding:6px 8px;vertical-align:middle">${perfHtml}</td>
              <td style="padding:6px 0 6px 4px"><div style="background:#e5e7eb;border-radius:4px;height:10px"><div style="background:#4f46e5;border-radius:4px;height:10px;width:${pct}%"></div></div></td>
            </tr>`;
          }).join('') +
          '</table>';
      } catch(e) { /* analytics optional */ }
    }
  </script>

  <div id="notif-panel" style="display:none;position:fixed;top:52px;right:16px;width:340px;max-width:95vw;max-height:480px;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.16);z-index:999;overflow:hidden;flex-direction:column">
