<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Startup Radar — Founder Dashboard</title>
  <style>
    body { font-family: system-ui; max-width: 900px; margin: 0 auto; padding: 20px; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 2px solid #4f46e5; margin-bottom: 24px; }
    nav h1 { margin: 0; color: #4f46e5; }
    nav button { background: none; border: 1px solid #ddd; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .filters select, .filters input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .search-bar input { flex: 1; padding: 10px 14px; border: 2px solid #4f46e5; border-radius: 6px; font-size: 15px; }
    .search-bar button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; }
    .search-bar button:hover { background: #4338ca; }
    .back-btn { display: inline-block; margin-bottom: 12px; background: none; border: 1px solid #4f46e5; color: #4f46e5; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin: 12px 0; position: relative; }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .score-badge { position: absolute; top: 16px; right: 16px; background: #4f46e5; color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; user-select: none; }
    .score-badge:hover { opacity: 0.85; }
    .score-badge.high { background: #10b981; }
    .score-badge.mid { background: #f59e0b; }
    .score-badge.low { background: #6b7280; }
    .explanation-panel { display: none; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px 16px; margin-top: 10px; }
    .explanation-panel.open { display: block; }
    .exp-item { font-size: 13px; padding: 3px 0; }
    .exp-item.match { color: #059669; }
    .exp-item.nomatch { color: #dc2626; }
    .exp-item.partial { color: #d97706; }
    .tag { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 2px; }
    .type-badge { display: inline-block; background: #dbeafe; color: #1e40af; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .contact-btn { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 8px; }
    .contact-btn.contacted { background: #10b981; cursor: default; }
    .empty { text-align: center; color: #9ca3af; padding: 40px; }
    .spinner { text-align: center; color: #6b7280; padding: 32px; font-size: 18px; }
    .invite-section { background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 8px; padding: 20px; margin-top: 24px; }
    .invite-link { font-family: monospace; background: white; border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; font-size: 13px; flex: 1; }
    .copy-btn { background: #4f46e5; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .early-badge { display: inline-block; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-left: 8px; }
    .featured-card { border: 2px solid #f59e0b; box-shadow: 0 0 0 2px #fef3c7; }
    .featured-chip { display: inline-block; background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; margin-left: 6px; }
    #status { color: #4f46e5; margin: 8px 0; font-size: 13px; font-weight: 600; }
    .mode-label { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
    .star-rating { margin-top: 8px; }
    .star-rating span { font-size: 20px; cursor: pointer; color: #d1d5db; transition: color .15s; }
    .star-rating span.active, .star-rating span:hover { color: #f59e0b; }
    /* K-88: Autocomplete */
    .ac-item { padding: 9px 14px; cursor: pointer; font-size: 14px; color: #1f2937; display: flex; align-items: center; gap: 8px; }
    .ac-item:hover, .ac-item.ac-active { background: #ede9fe; }
    .ac-type { font-size: 11px; color: #9ca3af; background: #f3f4f6; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
    .save-search-btn { background: none; border: 1px solid #6b7280; color: #6b7280; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .save-search-btn:hover { border-color: #4f46e5; color: #4f46e5; }
    .saved-searches { margin-top: 8px; }
    .saved-search-chip { display: inline-block; background: #ede9fe; color: #5b21b6; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin: 2px; cursor: pointer; }
    .saved-search-chip:hover { background: #ddd6fe; }
    /* K-102: Filter presets */
    .preset-btn { background: #f3f4f6; border: 1px solid #e5e7eb; color: #374151; padding: 4px 12px; border-radius: 16px; cursor: pointer; font-size: 12px; font-weight: 500; }
    .preset-btn:hover, .preset-btn.active { background: #ede9fe; border-color: #c4b5fd; color: #4f46e5; }

    /* K-95: Grid / list view toggle */
    .view-toggle-btn { background: none; border: 1px solid #e5e7eb; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; color: #6b7280; }
    .view-toggle-btn.active { border-color: #4f46e5; color: #4f46e5; background: #ede9fe; }
    #results.view-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    #results.view-grid .card { margin: 0; }
    #results.view-list .card { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; margin: 6px 0; }
    #results.view-list .card .score-badge { position: static; flex-shrink: 0; align-self: flex-start; margin-top: 2px; }
    #results.view-list .card img { display: none; }
    #results.view-list .card .explanation-panel { display: none !important; }

    /* K-23: Mobile responsive */
    @media (max-width: 640px) {
      body { padding: 12px; }
      nav { flex-direction: column; align-items: flex-start; gap: 8px; }
      nav div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      nav h1 { font-size: 16px; }
      .filters, .search-bar { flex-direction: column; }
      .filters select, .filters input { width: 100%; box-sizing: border-box; }
      .search-bar input, .search-bar button { width: 100%; box-sizing: border-box; }
      .card { padding: 14px; }
      .score-badge { position: static; display: inline-block; margin-top: 8px; }
      .contact-btn, .action-btn, button[type=submit] { width: 100%; padding: 12px; font-size: 15px; box-sizing: border-box; }
      input[type=text], input[type=email], input[type=password], textarea, select { width: 100%; box-sizing: border-box; }
      .grid, .kpi-grid { grid-template-columns: 1fr !important; }
      table { font-size: 12px; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <nav>
    <h1>&#x1F680; Startup Radar</h1>
    <div>
      <span id="user-name"></span>
      <button id="bell-btn" onclick="toggleNotifPanel()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;position:relative;padding:0 4px;vertical-align:middle" title="Benachrichtigungen"><span id="bell-icon">🔔</span><span id="notif-count" style="display:none;position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:50%;font-size:10px;padding:1px 4px;font-weight:700"></span></button>
    <a href="messages.html" id="msg-badge" style="background:#4f46e5;color:white;text-decoration:none;padding:8px 14px;border-radius:4px;font-size:13px;margin-right:8px">&#x1F4AC; Messages</a><button onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- K-82: Personalized welcome banner -->
  <div id="welcome-banner" style="display:none;background:linear-gradient(135deg,#ede9fe,#e0e7ff);border-radius:10px;padding:14px 20px;margin-bottom:18px;align-items:center;justify-content:space-between">
    <div>
      <div id="welcome-text" style="font-size:18px;font-weight:700;color:#3730a3"></div>
      <div id="welcome-sub" style="font-size:13px;color:#6b7280;margin-top:2px"></div>
      <!-- K-112: Sector tag pills -->
      <div id="welcome-sector-tags" style="display:none;margin-top:8px;flex-wrap:wrap;gap:6px"></div>
    </div>
    <button onclick="document.getElementById('welcome-banner').style.display='none'" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:16px;padding:4px">&#x2715;</button>
  </div>

  <div class="search-bar">
    <!-- K-88: Autocomplete wrapper -->
    <div style="flex:1;position:relative">
      <input type="text" id="search-input" placeholder="Search listings&#8230; (equipment, services, city)" onkeydown="handleSearchKey(event)" oninput="debounceAutocomplete(this.value)" autocomplete="off" style="width:100%;padding:10px 14px;border:2px solid #4f46e5;border-radius:6px;font-size:15px;box-sizing:border-box" title="Tipp: Drücke / um die Suche zu fokussieren">
      <div id="autocomplete-dropdown" style="display:none;position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #d1d5db;border-top:none;border-radius:0 0 6px 6px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:200;max-height:220px;overflow-y:auto"></div>
    </div>
    <button onclick="runSearch()">&#x1F50D; Search</button>
  </div>

  <!-- K-107: Search history panel -->
  <div id="search-history-panel" style="display:none;margin-bottom:8px;font-size:12px">
    <span style="color:#9ca3af;margin-right:6px">Zuletzt gesucht:</span>
    <span id="search-history-chips"></span>
    <button onclick="clearSearchHistory()" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:11px;margin-left:8px;text-decoration:underline">löschen</button>
  </div>

  <div id="back-wrap" style="display:none">
    <button class="back-btn" onclick="exitSearch()">&#8592; Back to Radar Results</button>
  </div>

  <div id="mode-label" class="mode-label">Radar Results</div>

  <!-- K-102: Filter presets -->
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="filter-presets">
    <span style="font-size:12px;color:#9ca3af;align-self:center;margin-right:2px">Schnell:</span>
    <button onclick="applyPreset('all')" class="preset-btn" id="preset-all">Alle</button>
    <button onclick="applyPreset('seed')" class="preset-btn" id="preset-seed">&#x1F331; Seed-ready</button>
    <button onclick="applyPreset('remote')" class="preset-btn" id="preset-remote">&#x1F30D; Remote</button>
    <button onclick="applyPreset('local')" class="preset-btn" id="preset-local">&#x1F4CD; Lokal</button>
  </div>

  <div class="filters" id="radar-filters">
    <!-- K-64: type filter -->
    <select id="f-type" onchange="loadRadar()">
      <option value="">Alle Typen</option>
      <option value="funding">Funding</option>
      <option value="equipment">Equipment</option>
      <option value="services">Services</option>
      <option value="workspace">Workspace</option>
      <option value="mentoring">Mentoring</option>
    </select>
    <select id="f-stage">
      <option value="">Alle Stages</option>
      <option value="pre-seed">Pre-Seed</option>
      <option value="seed">Seed</option>
      <option value="series-a">Series A</option>
    </select>
    <select id="f-geo">
      <option value="">Alle Regionen</option>
      <option value="local">Lokal</option>
      <option value="regional">Regional</option>
      <option value="national">National</option>
    </select>
    <input type="text" id="f-city" placeholder="Stadt..." style="width:140px">
    <button onclick="loadRadar()" style="background:#4f46e5;color:white;border:none;padding:8px 16px;border-radius:4px;cursor:pointer">Aktualisieren</button>
    <button onclick="resetFilters()" style="background:#f9fafb;color:#374151;border:1px solid #e5e7eb;padding:8px 14px;border-radius:4px;cursor:pointer">Zurücksetzen</button>
    <button class="save-search-btn" onclick="saveCurrentSearch()">&#x2665; Save Search</button>
  </div>

  <div class="saved-searches" id="saved-searches"></div>
  <div id="status"></div>
  <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:8px">
    <button onclick="showBookmarks()" style="background:#f9fafb;border:1px solid #e5e7eb;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;color:#374151">❤️ Gespeicherte Inserate</button>
    <!-- K-95: View toggle -->
    <button id="btn-view-grid" class="view-toggle-btn active" onclick="setView('grid')" title="Rasteransicht">⊞</button>
    <button id="btn-view-list" class="view-toggle-btn" onclick="setView('list')" title="Listenansicht">☰</button>
  </div>
  <!-- K-79: Recently viewed listings -->
  <div id="recently-viewed" style="display:none;margin-bottom:12px"></div>

  <!-- K-61: Profile completeness widget -->
  <div id="profile-completeness" style="display:none;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:13px"></div>

  <!-- K-72: Activity feed — new listings for you -->
  <div id="feed-section" style="display:none;margin-bottom:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0;font-size:15px;font-weight:700;color:#111827">&#x1F195; Neu für dich</h2>
      <span id="feed-count" style="font-size:12px;color:#6b7280"></span>
    </div>
    <div id="feed-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px"></div>
  </div>

  <div id="results"><div class="empty">Lade Radar-Ergebnisse...</div></div>

  <script src="api-client.js"></script>
  <script>
    redirectIfNotLoggedIn();
    const user = auth.getUser();

    // K-107: Search history
    const SEARCH_HIST_KEY = 'search_history';
    function pushSearchHistory(q) {
      if (!q) return;
      try {
        let hist = JSON.parse(localStorage.getItem(SEARCH_HIST_KEY) || '[]');
        hist = [q, ...hist.filter(h => h !== q)].slice(0, 10);
        localStorage.setItem(SEARCH_HIST_KEY, JSON.stringify(hist));
        renderSearchHistory();
      } catch(_) {}
    }
    function renderSearchHistory() {
      try {
        const hist = JSON.parse(localStorage.getItem(SEARCH_HIST_KEY) || '[]');
        const panel = document.getElementById('search-history-panel');
        const chips = document.getElementById('search-history-chips');
        if (!hist.length) { panel.style.display = 'none'; return; }
        chips.innerHTML = hist.map(h =>
          `<span style="display:inline-block;background:#f3f4f6;border:1px solid #e5e7eb;color:#374151;padding:2px 10px;border-radius:12px;cursor:pointer;margin:2px 3px 2px 0;font-size:12px" onclick="applyHistorySearch('${h.replace(/'/g,"&#39;")}')">${h}</span>`
        ).join('');
        panel.style.display = 'block';
      } catch(_) {}
    }
    function applyHistorySearch(q) {
      document.getElementById('search-input').value = q;
      runSearch();
    }
    function clearSearchHistory() {
      localStorage.removeItem(SEARCH_HIST_KEY);
      document.getElementById('search-history-panel').style.display = 'none';
    }

    // K-102: Filter presets
    const PRESETS = {
      all:    { type: '', stage: '', geo: '', city: '' },
      seed:   { type: '', stage: 'seed', geo: 'national', city: '' },
      remote: { type: '', stage: '', geo: 'national', city: '' },
      local:  { type: '', stage: '', geo: 'local', city: '' },
    };
    function applyPreset(name) {
      const p = PRESETS[name];
      if (!p) return;
      document.getElementById('f-type').value  = p.type;
      document.getElementById('f-stage').value = p.stage;
      document.getElementById('f-geo').value   = p.geo;
      document.getElementById('f-city').value  = p.city;
      // Toggle active class
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('preset-' + name);
      if (btn) btn.classList.add('active');
      loadRadar();
    }

    // K-95: Grid / list view toggle — persisted in localStorage
    function setView(mode) {
      localStorage.setItem('radar_view', mode);
      const el = document.getElementById('results');
      el.classList.toggle('view-grid', mode === 'grid');
      el.classList.toggle('view-list', mode === 'list');
      document.getElementById('btn-view-grid').classList.toggle('active', mode === 'grid');
      document.getElementById('btn-view-list').classList.toggle('active', mode === 'list');
    }
    // Apply stored view on load
    setView(localStorage.getItem('radar_view') || 'grid');

    // K-79: Recently viewed listings widget
    function showRecentlyViewed() {
      try {
        const items = JSON.parse(localStorage.getItem('recently_viewed') || '[]');
        if (!items.length) return;
        const el = document.getElementById('recently-viewed');
        el.style.display = 'block';
        el.innerHTML = '<div style="font-size:12px;color:#6b7280;margin-bottom:6px;font-weight:600">Zuletzt angesehen:</div>' +
          '<div style="display:flex;flex-wrap:wrap;gap:6px">' +
          items.map(e =>
            `<a href="listing.html?id=${e.id}" style="display:inline-flex;align-items:center;gap:4px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:16px;padding:4px 12px;font-size:12px;color:#374151;text-decoration:none;white-space:nowrap" title="${(e.title||'').replace(/"/g,'&quot;')}">` +
            `<span style="color:#6b7280;font-size:10px">${e.type || ''}</span> ${(e.title || '').slice(0,32)}${(e.title||'').length > 32 ? '…' : ''}</a>`
          ).join('') +
          '</div>';
      } catch(e) { /* localStorage unavailable */ }
    }
    showRecentlyViewed();

    // K-61: Profile completeness indicator
    function showCompletenessIndicator(profile) {
      const fields = [
        { key: 'company_name', label: 'Startup-Name' },
        { key: 'stage', label: 'Funding-Stage' },
        { key: 'sector', label: 'Sektor' },
        { key: 'city', label: 'Stadt' },
        { key: 'description', label: 'Beschreibung' },
        { key: 'team_size', label: 'Teamgröße' },
      ];
      const done = fields.filter(f => profile[f.key]);
      const pct = Math.round((done.length / fields.length) * 100);
      if (pct >= 100) return; // fully complete — hide widget
      const missing = fields.filter(f => !profile[f.key]).map(f => f.label);
      const el = document.getElementById('profile-completeness');
      const color = pct >= 66 ? '#10b981' : pct >= 33 ? '#f59e0b' : '#ef4444';
      el.style.display = 'block';
      el.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:180px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-weight:600;color:#374151">Profil-Vollständigkeit</span>
              <span style="color:${color};font-weight:700">${pct}%</span>
            </div>
            <div style="height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:${color};border-radius:99px;transition:width .4s"></div>
            </div>
            ${missing.length ? `<div style="margin-top:5px;color:#6b7280">Fehlend: ${missing.join(', ')}</div>` : ''}
          </div>
          <a href="onboarding.html" style="color:#4f46e5;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap">Profil vervollständigen →</a>
        </div>
      `;
    }

    let _founderProfile = null; // K-85: cached profile for edit form

    // K-33: Gate dashboard — redirect to onboarding if profile not complete
    // K-82: Show personalized welcome banner with display_name
    (async () => {
      try {
        const r = await api('GET', '/founders/profile', null, auth.getToken());
        if (!r.profile || !r.profile.company_name) throw new Error('incomplete');
        _founderProfile = r.profile;
        showCompletenessIndicator(r.profile);

        // Welcome banner
        const name = r.profile.display_name || r.profile.company_name || user?.name || null;
        if (name) {
          const banner = document.getElementById('welcome-banner');
          const hour = new Date().getHours();
          const greeting = hour < 12 ? 'Guten Morgen' : hour < 18 ? 'Willkommen zurück' : 'Guten Abend';
          document.getElementById('welcome-text').textContent = greeting + ', ' + name + '!';
          document.getElementById('welcome-sub').textContent = r.profile.company_name
            ? r.profile.company_name + ' · ' + (r.profile.stage || '') + (r.profile.city ? ' · ' + r.profile.city : '')
            : 'Dein Founder-Dashboard';
          // K-112: sector tag pills — clickable filters
          const sector = r.profile.sector;
          if (sector) {
            const tagsEl = document.getElementById('welcome-sector-tags');
            tagsEl.innerHTML =
              '<span style="font-size:11px;color:#6b7280;align-self:center;margin-right:2px">Filter:</span>' +
              '<span onclick="applyHistorySearch(\'' + sector.replace(/'/g, "\\'") + '\')" ' +
                'style="display:inline-flex;align-items:center;gap:4px;background:#4f46e5;color:#fff;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer" ' +
                'title="Nach ' + sector + ' suchen">🏷 ' + sector + '</span>';
            tagsEl.style.display = 'flex';
          }
          banner.style.display = 'flex';
        }
      } catch (_) {
        if (location.pathname.indexOf('onboarding') === -1) {
          location.replace('onboarding.html');
        }
      }
    })();
    document.getElementById('user-name').textContent = user?.name || user?.email || '';

    let radarCache = null;

    function logout() { AuthAPI.logout(); location.href = 'auth.html'; }

    // K-90: Contact history
    let _contactsLoaded = false;
    function toggleContactHistory() {
      const panel = document.getElementById('contact-history-panel');
      const open = panel.style.display !== 'none';
      panel.style.display = open ? 'none' : 'block';
      document.getElementById('contact-history-toggle').style.borderRadius = open ? '6px' : '8px 8px 0 0';
      if (!open && !_contactsLoaded) loadContactHistory();
    }

    async function loadContactHistory() {
      _contactsLoaded = true;
      const list = document.getElementById('contact-history-list');
      try {
        const data = await api('GET', '/founders/contacts', null, auth.getToken());
        const contacts = data.contacts || [];
        if (!contacts.length) {
          list.innerHTML = '<p style="color:#9ca3af;font-size:13px;text-align:center;padding:12px 0">Du hast noch keinen Anbieter kontaktiert.</p>';

    let _acTimer = null;
    let _acIndex = -1;

    function debounceAutocomplete(val) {
      clearTimeout(_acTimer);
      if (!val || val.trim().length < 2) { closeAutocomplete(); return; }
      _acTimer = setTimeout(() => fetchSuggestions(val.trim()), 200);
    }

    async function fetchSuggestions(q) {
      try {
        const data = await api('GET', '/listings/suggest?q=' + encodeURIComponent(q), null, null);
        renderAutocomplete(data.suggestions || [], q);
      } catch(_) { closeAutocomplete(); }
    }

    function renderAutocomplete(suggestions, q) {
      const dd = document.getElementById('autocomplete-dropdown');
      if (!suggestions.length) { closeAutocomplete(); return; }
      _acIndex = -1;
      dd.innerHTML = suggestions.map((s, i) =>
        `<div class="ac-item" data-idx="${i}" data-label="${s.label.replace(/"/g,'&quot;')}" onmousedown="selectSuggestion('${s.label.replace(/'/g,"\\'")}')">
          ${s.label.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'i'), '<strong>$1</strong>')}
          <span class="ac-type">${s.type === 'tag' ? 'tag' : 'listing'}</span>
        </div>`
      ).join('');
      dd.style.display = 'block';
    }

    function selectSuggestion(label) {
      document.getElementById('search-input').value = label;
      closeAutocomplete();
      runSearch();
    }

    function closeAutocomplete() {
      const dd = document.getElementById('autocomplete-dropdown');
      if (dd) dd.style.display = 'none';
      _acIndex = -1;
    }

    function handleSearchKey(e) {
      const dd = document.getElementById('autocomplete-dropdown');
      const items = dd ? dd.querySelectorAll('.ac-item') : [];
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        _acIndex = Math.min(_acIndex + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('ac-active', i === _acIndex));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        _acIndex = Math.max(_acIndex - 1, -1);
        items.forEach((el, i) => el.classList.toggle('ac-active', i === _acIndex));
      } else if (e.key === 'Enter') {
        if (_acIndex >= 0 && items[_acIndex]) {
          const label = items[_acIndex].dataset.label;
          document.getElementById('search-input').value = label;
          closeAutocomplete();
          runSearch();
        } else {
          runSearch();
        }
      } else if (e.key === 'Escape') {
        closeAutocomplete();
      }
    }

      const url = new URL(location.href);
      ['type', 'stage', 'geo', 'city'].forEach(k => {
        if (params[k]) url.searchParams.set(k, params[k]);
        else url.searchParams.delete(k);
      });
      history.replaceState(null, '', url.toString());
    }

    function restoreFiltersFromURL() {
      const p = new URLSearchParams(location.search);
      if (p.get('type'))  document.getElementById('f-type').value  = p.get('type');
      if (p.get('stage')) document.getElementById('f-stage').value = p.get('stage');
      if (p.get('geo'))   document.getElementById('f-geo').value   = p.get('geo');
      if (p.get('city'))  document.getElementById('f-city').value  = p.get('city');

            '<div style="font-size:24px;margin-bottom:8px">🔍</div>' +
            '<div style="font-weight:600;margin-bottom:4px">Keine Matches gefunden</div>' +
            '<div style="font-size:13px;color:#9ca3af">Passe deine Filter an oder setze sie zurück.</div>' +
            filterHint +
            (activeFilters.length ? '<button onclick="resetFilters()" style="margin-top:12px;background:#4f46e5;color:#fff;border:none;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:13px">Filter zurücksetzen</button>' : '') +
            '</div>';
          // K-109: clear count badge
          document.getElementById('mode-label').innerHTML = 'Radar Results';
          document.getElementById('status').textContent = '';
        } else {
          el.innerHTML = data.listings.map(renderListing).join('');
          radarCache = el.innerHTML;
          // K-109: embed count pill in mode label
          const cnt = data.total || data.listings.length;
          document.getElementById('mode-label').innerHTML =
            'Radar Results <span style="display:inline-block;background:#4f46e5;color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px;margin-left:6px;vertical-align:middle">' + cnt + '</span>';
          document.getElementById('status').textContent = '';
        }
      } catch(ex) {
        document.getElementById('results').innerHTML = '<div class="empty">Fehler: ' + ex.message + '</div>';
      }
    }

    // K-72: Activity feed
    async function loadFeed() {
      try {
        const data = await FoundersAPI.getFeed();
        const listings = data.listings || [];
        if (!listings.length) return;
        const grid = document.getElementById('feed-grid');
        const section = document.getElementById('feed-section');
        document.getElementById('feed-count').textContent = listings.length + ' neue Inserate in den letzten 7 Tagen';
        grid.innerHTML = listings.map(l =>
          '<a href="listing.html?id=' + l.id + '" style="text-decoration:none;color:inherit">' +
          '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px;cursor:pointer;border-top:3px solid #4f46e5" onmouseover="this.style.boxShadow=\'0 2px 10px rgba(0,0,0,.08)\'" onmouseout="this.style.boxShadow=\'none\'">' +
          '<div style="font-size:11px;color:#4f46e5;font-weight:600;margin-bottom:4px">' + (l.type || '') + (l.city ? ' · ' + l.city : '') + '</div>' +
          '<div style="font-weight:600;font-size:13px;color:#111827;line-height:1.3;margin-bottom:4px">' + l.title + '</div>' +
          '<div style="font-size:11px;color:#9ca3af">' + new Date(l.created_at).toLocaleDateString('de-DE') + '</div>' +
          '</div></a>'
        ).join('');
        section.style.display = 'block';
      } catch(e) { /* feed optional */ }
    }

    restoreFiltersFromURL();
    renderSearchHistory(); // K-107: show on load if history exists
    loadRadar();
    loadFeed();

    // K-114: "/" keyboard shortcut to focus search input
    document.addEventListener('keydown', (e) => {
      if (e.key !== '/') return;
      const tag = document.activeElement?.tagName?.toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      e.preventDefault();
      const inp = document.getElementById('search-input');
      if (inp) { inp.focus(); inp.select(); }
    });
  </script>
  <!-- K-51: Referral / Invite section (hidden until code loaded) -->
  <div id="invite-section" style="display:none;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:20px 24px;margin:16px 0;max-width:800px;margin-left:auto;margin-right:auto">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0;color:#4f46e5">🎁 Freunde einladen</h3>
      <div id="early-badge"></div>
    </div>
    <p style="color:#6b7280;font-size:14px;margin:8px 0 12px">Teile deinen Link. Für je 3 Einladungen erhältst du den <strong>Early Adopter</strong>-Badge.</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input type="text" id="invite-link" class="invite-link" readonly style="font-family:monospace;background:#fff;border:1px solid #ddd6fe;border-radius:6px;padding:8px 12px;font-size:13px;flex:1;min-width:200px;color:#374151" value="">
      <button onclick="copyInviteLink()" class="copy-btn" style="padding:8px 16px;background:#4f46e5;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap">Link kopieren</button>
    </div>
    <p id="invite-count" style="margin:10px 0 0;font-size:13px;color:#6b7280;font-weight:500">0 erfolgreiche Einladungen</p>
  </div>

  <!-- K-90: Contact history panel -->
  <div style="margin-top:18px" id="contact-history-wrap" style="display:none">
    <button onclick="toggleContactHistory()" id="contact-history-toggle" style="background:#f3f4f6;border:1px solid #d1d5db;color:#374151;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;width:100%;text-align:left">
      &#x1F4E8; Kontaktierte Anbieter
    </button>
    <div id="contact-history-panel" style="display:none;background:#fff;border:1px solid #e5e7eb;border-radius:0 0 8px 8px;padding:16px 20px">
      <div id="contact-history-list"><p style="color:#9ca3af;font-size:13px;text-align:center;padding:12px 0">Lade…</p></div>
    </div>
  </div>

  <!-- K-85: Founder profile edit panel -->
  <div style="margin-top:24px">
    <button onclick="toggleProfileEdit()" id="profile-edit-toggle" style="background:#f3f4f6;border:1px solid #d1d5db;color:#374151;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;width:100%;text-align:left">
      &#x270F;&#xFE0F; Profil bearbeiten
    </button>
    <div id="profile-edit-panel" style="display:none;background:#fff;border:1px solid #e5e7eb;border-radius:0 0 8px 8px;padding:20px 24px;margin-top:0">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 16px">
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Dein Name</label>
          <input id="pe-display_name" type="text" placeholder="Max Müller" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Startup-Name</label>
          <input id="pe-company_name" type="text" placeholder="FinNext GmbH" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Funding-Stage</label>
          <select id="pe-stage" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
            <option value="">— Bitte wählen —</option>
            <option value="idea">Idee / Konzept</option>
            <option value="pre-seed">Pre-Seed</option>
            <option value="seed">Seed</option>
            <option value="series-a">Series A</option>
            <option value="series-b">Series B+</option>
            <option value="bootstrapped">Bootstrapped</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Sektor</label>
          <select id="pe-sector" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
            <option value="">— Bitte wählen —</option>
            <option value="fintech">Fintech</option>
            <option value="healthtech">Healthtech</option>
            <option value="edtech">Edtech</option>
            <option value="ecommerce">E-Commerce</option>
            <option value="saas">SaaS / B2B</option>
            <option value="deeptech">Deeptech</option>
            <option value="cleantech">Cleantech</option>
            <option value="mobility">Mobility</option>
            <option value="proptech">Proptech</option>
            <option value="mediatech">Media</option>
            <option value="other">Sonstiges</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Stadt / Region</label>
          <input id="pe-city" type="text" placeholder="Berlin" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
        </div>
        <!-- K-113: team_size field -->
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Teamgröße</label>
          <input id="pe-team_size" type="number" min="1" max="9999" placeholder="z. B. 3" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Suchradius</label>
          <select id="pe-geo" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px">
            <option value="local">Lokal (&lt;50 km)</option>
            <option value="regional">Regional (&lt;200 km)</option>
            <option value="national">National (DE)</option>
            <option value="dach">DACH-Region</option>
            <option value="europe">Europa</option>
            <option value="global">Global / Remote</option>
          </select>
        </div>
      </div>
      <div style="margin-top:12px">
        <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px">Kurzbeschreibung</label>
        <textarea id="pe-description" rows="2" placeholder="Was macht euer Startup?" style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;resize:vertical"></textarea>
      </div>
      <div style="margin-top:14px;display:flex;align-items:center;gap:10px">
        <button onclick="saveProfileEdit()" style="background:#4f46e5;color:#fff;border:none;padding:9px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600">Speichern</button>
        <button onclick="toggleProfileEdit()" style="background:#f3f4f6;color:#374151;border:1px solid #d1d5db;padding:9px 14px;border-radius:6px;cursor:pointer;font-size:14px">Abbrechen</button>
        <span id="pe-status" style="font-size:13px;color:#6b7280"></span>
      </div>
    </div>
  </div>

  <!-- K-50: Notification panel -->
  <div id="notif-panel" style="display:none;position:fixed;top:52px;right:16px;width:340px;max-width:95vw;max-height:480px;background:#fff;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.16);z-index:999;overflow:hidden;display:none;flex-direction:column">
    <div style="padding:14px 16px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between">
      <strong style="font-size:15px">Benachrichtigungen</strong>
      <div style="display:flex;gap:8px;align-items:center">
        <button onclick="markAllRead()" style="font-size:12px;color:#4f46e5;background:none;border:none;cursor:pointer;padding:0">Alle gelesen</button>
        <button onclick="closeNotifPanel()" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:16px">✕</button>
      </div>
    </div>
    <div id="notif-list" style="overflow-y:auto;max-height:400px;padding:0"></div>
  </div>

  <!-- K-48: Bookmarks panel -->
  <div id="bookmarks-panel" style="display:none;position:fixed;top:0;right:0;width:360px;max-width:95vw;height:100vh;background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:1000;padding:24px;overflow-y:auto">
    <button onclick="document.getElementById('bookmarks-panel').style.display='none'" style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280">✕</button>
  </div>
