<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Startup Radar — Messages</title>
  <style>
    body { font-family: system-ui; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 2px solid #4f46e5; background: white; }
    nav h1 { margin: 0; color: #4f46e5; font-size: 18px; }
    nav a { color: #4f46e5; text-decoration: none; font-size: 13px; }
    .layout { display: flex; flex: 1; overflow: hidden; }
    .threads { width: 280px; border-right: 1px solid #e5e7eb; overflow-y: auto; background: #f9fafb; }
    .thread-item { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid #e5e7eb; }
    .thread-item:hover, .thread-item.active { background: #ede9fe; }
    .thread-item .name { font-weight: 600; font-size: 14px; }
    .thread-item .preview { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread-item .listing { font-size: 11px; color: #9ca3af; }
    .unread-dot { display: inline-block; width: 8px; height: 8px; background: #4f46e5; border-radius: 50%; margin-left: 6px; }
    .chat { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 14px 20px; border-bottom: 1px solid #e5e7eb; background: white; font-weight: 600; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 60%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
    .msg.mine { background: #4f46e5; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.theirs { background: #f3f4f6; color: #111827; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg .meta { font-size: 11px; opacity: 0.7; margin-top: 4px; }
    .chat-input { display: flex; flex-direction: column; gap: 6px; padding: 10px 20px 14px; border-top: 1px solid #e5e7eb; background: white; }
    .chat-input-row { display: flex; gap: 10px; align-items: center; }
    .chat-input input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; }
    .chat-input input:focus { border-color: #4f46e5; }
    .chat-input button.send-btn { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; }
    .templates-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .tpl-chip { background: #ede9fe; color: #4f46e5; border: none; border-radius: 12px; padding: 3px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .tpl-chip:hover { background: #ddd6fe; }
    .tpl-manage-btn { background: none; border: 1px dashed #d1d5db; color: #9ca3af; border-radius: 12px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
    .tpl-manage-btn:hover { border-color: #4f46e5; color: #4f46e5; }
    .empty { text-align: center; color: #9ca3af; padding: 40px; }
    .no-thread { display: flex; align-items: center; justify-content: center; flex: 1; color: #9ca3af; font-size: 16px; }
  
    /* K-23: Mobile responsive */
    @media (max-width: 640px) {
      body { padding: 12px; }
      nav { flex-direction: column; align-items: flex-start; gap: 8px; }
      nav div { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      nav h1 { font-size: 16px; }
      .filters, .search-bar { flex-direction: column; }
      .filters select, .filters input { width: 100%; box-sizing: border-box; }
      .search-bar input, .search-bar button { width: 100%; box-sizing: border-box; }
      .card { padding: 14px; }
      .score-badge { position: static; display: inline-block; margin-top: 8px; }
      .contact-btn, .action-btn, button[type=submit] { width: 100%; padding: 12px; font-size: 15px; box-sizing: border-box; }
      input[type=text], input[type=email], input[type=password], textarea, select { width: 100%; box-sizing: border-box; }
      .grid, .kpi-grid { grid-template-columns: 1fr !important; }
      table { font-size: 12px; }
      th, td { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <nav>
    <h1>&#x1F4AC; Messages</h1>
    <div style="display:flex;gap:16px;align-items:center">
      <a href="founder-dashboard.html">&#x2190; Founder Dashboard</a>
      <a href="provider-dashboard.html">Provider Dashboard</a>
    </div>
  </nav>

  <div class="layout">
    <div class="threads" id="threads">
      <div class="empty">Loading threads...</div>
    </div>

    <div class="chat" id="chat">
      <div class="no-thread">Select a conversation</div>
    </div>
  </div>

  <script src="api-client.js"></script>
  <script>
    redirectIfNotLoggedIn();
    const user = auth.getUser();
    let activeThread = null;
    let pollInterval = null;

    // Check URL params for direct thread open
    const params = new URLSearchParams(location.search);
    const paramTo = params.get('to');
    const paramListing = params.get('listing');

    async function loadThreads() {
      try {
        const data = await api('GET', '/messages', null, auth.getToken());
        const threads = data.threads || [];
        const el = document.getElementById('threads');
        if (!threads.length) {
          el.innerHTML = '<div class="empty">No conversations yet.</div>';
          return;
        }
        el.innerHTML = threads.map(t => `
          <div class="thread-item ${activeThread?.other_id === t.other_id && activeThread?.listing_id == t.listing_id ? 'active' : ''}"
               onclick="openThread(${JSON.stringify(t).replace(/"/g,'&quot;')})">
            <div class="name">${t.other_name || t.other_email}${t.unread_count > 0 ? '<span class="unread-dot"></span>' : ''}</div>
            <div class="listing">${t.listing_title ? '&#x1F4CB; ' + t.listing_title : ''}</div>
            <div class="preview">${t.last_body}</div>
          </div>`).join('');

        // Auto-open if URL param
        if (paramTo && !activeThread) {
          const match = threads.find(t => t.other_id === paramTo);
          if (match) openThread(match);
        }
      } catch(ex) {
        document.getElementById('threads').innerHTML = '<div class="empty">Error: ' + ex.message + '</div>';
      }
    }

    async function openThread(thread) {
      activeThread = thread;
      const chat = document.getElementById('chat');

      chat.innerHTML = `
        <div class="chat-header">
          ${thread.other_name || thread.other_email}
          ${thread.listing_title ? ' &mdash; <span style="color:#6b7280;font-size:13px">' + thread.listing_title + '</span>' : ''}
        </div>
        <div class="chat-messages" id="chat-messages">Loading...</div>
        <div class="chat-input">
          <!-- K-68: Templates bar -->
          <div class="templates-bar" id="tpl-bar"></div>
          <div class="chat-input-row">
            <input type="text" id="msg-input" placeholder="Nachricht schreiben..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button class="send-btn" onclick="sendMsg()">&#x27A4;</button>
          </div>
        </div>`;

      loadMessages(thread);
      loadTemplatesBar();
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(() => loadMessages(thread), 5000);
      loadThreads(); // refresh unread dots
    }

    async function loadMessages(thread) {
      try {
        const url = '/messages/thread?otherUserId=' + thread.other_id +
          (thread.listing_id ? '&listingId=' + thread.listing_id : '');
        const data = await api('GET', url, null, auth.getToken());
        const msgs = data.messages || [];
        const el = document.getElementById('chat-messages');
        if (!el) return;
        if (!msgs.length) { el.innerHTML = '<div class="empty">No messages yet. Say hi!</div>'; return; }
        const wasAtBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
        el.innerHTML = msgs.map(m => {
          const mine = m.sender_id === user?.id;
          const time = new Date(m.created_at).toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
          return `<div class="msg ${mine ? 'mine' : 'theirs'}">
            ${m.body}
            <div class="meta">${mine ? 'Du' : (m.sender_name || 'Provider')} &middot; ${time}</div>
          </div>`;
        }).join('');
        if (wasAtBottom) el.scrollTop = el.scrollHeight;
      } catch(ex) { /* polling — ignore errors */ }
    }

    async function sendMsg() {
      if (!activeThread) return;
      const input = document.getElementById('msg-input');
      const body = input?.value.trim();
      if (!body) return;
      input.value = '';
      try {
        await api('POST', '/messages', {
          listing_id: activeThread.listing_id,
          recipient_id: activeThread.other_id,
          body,
        }, auth.getToken());
        loadMessages(activeThread);
        loadThreads();
      } catch(ex) {
        alert('Error: ' + ex.message);
        input.value = body;
      }
    }

    // SSE for real-time new messages
    function connectSSE() {
      const token = auth.getToken();
      if (!token) return;
      const es = new EventSource('/api/listings/events?token=' + encodeURIComponent(token));
      es.addEventListener('new_message', () => {
        loadThreads();
        if (activeThread) loadMessages(activeThread);
      });
      es.onerror = () => { es.close(); setTimeout(connectSSE, 5000); };
    }

    // K-68: Template bar
    let cachedTemplates = [];

    async function loadTemplatesBar() {
      const bar = document.getElementById('tpl-bar');
      if (!bar) return;
      try {
        const data = await TemplatesAPI.getAll();
        cachedTemplates = data.templates || [];
        renderTemplatesBar();
      } catch(e) { /* templates optional */ }
    }

    function renderTemplatesBar() {
      const bar = document.getElementById('tpl-bar');
      if (!bar) return;
      if (!cachedTemplates.length) {
        bar.innerHTML = '<button class="tpl-manage-btn" onclick="openTemplateManager()">+ Vorlage erstellen</button>';
        return;
      }
      bar.innerHTML =
        cachedTemplates.map(t =>
          `<button class="tpl-chip" onclick="applyTemplate(${t.id})" title="${t.body.replace(/"/g,'&quot;')}">${t.name}</button>`
        ).join('') +
        '<button class="tpl-manage-btn" onclick="openTemplateManager()">&#9998; Vorlagen</button>';
    }

    function applyTemplate(id) {
      const t = cachedTemplates.find(x => x.id === id);
      if (!t) return;
      const input = document.getElementById('msg-input');
      if (input) { input.value = t.body; input.focus(); }
    }

    function openTemplateManager() {
      document.getElementById('tpl-modal').style.display = 'flex';
      renderTemplateManagerList();
    }
    function closeTemplateManager() {
      document.getElementById('tpl-modal').style.display = 'none';
    }

    function renderTemplateManagerList() {
      const list = document.getElementById('tpl-list');
      if (!cachedTemplates.length) { list.innerHTML = '<div style="color:#9ca3af;font-size:13px">Noch keine Vorlagen.</div>'; return; }
      list.innerHTML = cachedTemplates.map(t => `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f3f4f6">
          <div>
            <div style="font-weight:600;font-size:13px">${t.name}</div>
            <div style="font-size:12px;color:#6b7280;margin-top:2px">${t.body.slice(0,80)}${t.body.length>80?'…':''}</div>
          </div>
          <button onclick="removeTpl(${t.id})" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;padding:0 4px;flex-shrink:0">&#x2715;</button>
        </div>`).join('');
    }

    async function removeTpl(id) {
      try {
        await TemplatesAPI.delete(id);
        cachedTemplates = cachedTemplates.filter(t => t.id !== id);
        renderTemplateManagerList();
        renderTemplatesBar();
      } catch(e) { alert('Fehler: ' + e.message); }
    }

    async function saveNewTemplate() {
      const name = document.getElementById('tpl-name').value.trim();
      const body = document.getElementById('tpl-body').value.trim();
      const errEl = document.getElementById('tpl-err');
      errEl.textContent = '';
      if (!name || !body) { errEl.textContent = 'Name und Text sind Pflichtfelder.'; return; }
      try {
        const data = await TemplatesAPI.create(name, body);
        cachedTemplates.push(data.template);
        document.getElementById('tpl-name').value = '';
        document.getElementById('tpl-body').value = '';
        renderTemplateManagerList();
        renderTemplatesBar();
      } catch(e) { errEl.textContent = e.message; }
    }

    loadThreads();
    connectSSE();

    // If URL has a target to message (from "Message Provider" button)
    if (paramTo && !paramListing) {
      // Create a synthetic thread object for new conversations
      setTimeout(() => {
        if (!activeThread) {
          activeThread = { other_id: paramTo, listing_id: paramListing ? parseInt(paramListing) : null, other_name: 'Provider', listing_title: '' };
          openThread(activeThread);
        }
      }, 800);
    }
  </script>
  <!-- K-68: Template manager modal -->
  <div id="tpl-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center">
    <div style="background:#fff;border-radius:10px;padding:24px;width:460px;max-width:95vw;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="margin:0;font-size:16px">Schnellantwort-Vorlagen</h3>
        <button onclick="closeTemplateManager()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#6b7280">&#x2715;</button>
      </div>
      <div id="tpl-list" style="margin-bottom:16px"></div>
      <div style="border-top:1px solid #e5e7eb;padding-top:14px">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px">Neue Vorlage</div>
        <input type="text" id="tpl-name" placeholder="Name (z.B. 'Standardantwort')" maxlength="80"
          style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;box-sizing:border-box;margin-bottom:8px">
        <textarea id="tpl-body" rows="3" placeholder="Vorlagentext..." maxlength="1000"
          style="width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;resize:vertical;box-sizing:border-box;margin-bottom:8px"></textarea>
        <div id="tpl-err" style="color:#dc2626;font-size:12px;margin-bottom:6px"></div>
        <button onclick="saveNewTemplate()" style="background:#4f46e5;color:white;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:13px">Speichern</button>
      </div>
    </div>
  </div>
</body>
</html>
