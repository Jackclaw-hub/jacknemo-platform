<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Radar — Gründer Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👨‍💼 Gründer Dashboard</h1>
            <p>Deine zentrale Übersicht für Startup-Förderung</p>
        </header>

        <div class="profile-section">
            <h2>Dein Profil</h2>
            <div class="form-group">
                <label>Startup-Stadium</label>
                <select id="founderStage">
                    <option value="pre-seed">Pre-Seed (Idee)</option>
                    <option value="seed">Seed (Prototyp)</option>
                    <option value="series-a">Series A (Wachstum)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Branche</label>
                <select id="founderSector">
                    <option value="tech">Technology</option>
                    <option value="sustainability">Nachhaltigkeit</option>
                    <option value="creative">Kreativwirtschaft</option>
                    <option value="social">Social Impact</option>
                    <option value="lifestyle">Lifestyle</option>
                </select>
            </div>

            <div class="form-group">
                <label>Standort</label>
                <input type="text" id="founderLocation" placeholder="Berlin">
            </div>

            <div class="form-group">
                <label>Regionale Präferenz</label>
                <select id="geoPreference">
                    <option value="regional">Regional bevorzugt</option>
                    <option value="remote">Remote in Ordnung</option>
                </select>
            </div>

            <button class="btn" onclick="updateRadar()">Radar aktualisieren</button>
        </div>

        <div id="radarResults">
            <h2>Deine Opportunities</h2>
            <div class="radar-grid" id="opportunityGrid">
                <p>Bitte fülle dein Profil aus und aktualisiere den Radar.</p>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/founder.js"></script>
</body>
</html>
