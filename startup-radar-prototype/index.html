<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Radar — Welcome</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Startup Radar</h1>
            <p>Your unified platform for startup opportunities</p>
        </header>
        
        <main class="role-selector">
            <div class="role-card" onclick="location.href='founder.html'">
                <h2>👤 Founder</h2>
                <p>Looking for funding, equipment, or services?</p>
                <button>Enter as Founder</button>
            </div>
            
            <div class="role-card" onclick="location.href='supply-equipment.html'">
                <h2>🏢 Equipment/Space Provider</h2>
                <p>Have gear or space to share?</p>
                <button>List Equipment</button>
            </div>
            
            <div class="role-card" onclick="location.href='supply-services.html'">
                <h2>🎯 Service Provider</h2>
                <p>Offer services to startups?</p>
                <button>Offer Services</button>
            </div>
            
            <div class="role-card" onclick="location.href='admin.html'">
                <h2>⚙️ Platform Admin</h2>
                <p>Manage and moderate the platform</p>
                <button>Admin Dashboard</button>
            </div>
        </main>
    </div>
</body>
</html>
