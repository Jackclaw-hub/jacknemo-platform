<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Radar — Services</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 Services</h1>
            <p>Deine Plattform für Services</p>
        </header>

        <div class="profile-section">
            <h2>Deine Angebote</h2>
            <div class="form-group">
                <label>Typ</label>
                <select id="serviceType">
                    <option value="legal">Rechtliche Beratung</option>
                    <option value="design">Design & Branding</option>
                    <option value="tech">Technische Beratung</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Starter-freundlich</label>
                <input type="checkbox" id="starterFriendly">
            </div>

            <div class="form-group">
                <label>Mindestpreis</label>
                <input type="number" id="minPrice" placeholder="990">
            </div>

            <button class="btn" onclick="addServiceDraft()">Entwurf speichern</button>
        </div>

        <div id="serviceDrafts">
            <h2>Deine Entwürfe</h2>
            <div id="serviceDraftList"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/supply.js"></script>
</body>
</html>
