<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Radar — Equipment & Räume</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💌 Equipment & Räume</h1>
            <p>Deine Plattform für Equipment und Arbeitsplätze</p>
        </header>

        <div class="profile-section">
            <h2>Deine Angebote</h2>
            <div class="form-group">
                <label>Typ</label>
                <select id="equipmentType">
                    <option value="3d-printer">3D-Drucker</option>
                    <option value="workspace">Arbeitsplatz</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Tags</label>
                <input type="text" id="equipmentTags" placeholder="Prototyping, Hardware, Manufacturing">
            </div>

            <div class="form-group">
                <label>Stadt</label>
                <input type="text" id="equipmentCity" placeholder="Berlin">
            </div>

            <div class="form-group">
                <label>Stundensatz</label>
                <input type="number" id="equipmentHourlyRate" placeholder="15">
            </div>
            
            <div class="form-group">
                <label>Tagesrate</label>
                <input type="number" id="equipmentDailyRate" placeholder="100">
            </div>

            <button class="btn" onclick="addEquipmentDraft()">Entwurf speichern</button>
        </div>

        <div id="equipmentDrafts">
            <h2>Deine Entwürfe</h2>
            <div id="equipmentDraftList"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/supply.js"></script>
</body>
</html>
